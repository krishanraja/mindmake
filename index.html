    <!-- CRITICAL: Prevent horizontal scrollbar flash before any CSS loads -->
    <!-- This MUST be first to ensure overflow is hidden from first paint -->
    <style>
      html, body { overflow-x: hidden !important; max-width: 100vw !important; }
      #root { overflow-x: hidden; max-width: 100vw; }
      /* Prevent hero content from causing scrollbar during CSS/font loading race */
      #hero { overflow: hidden !important; max-width: 100vw !important; }
      #hero * { max-width: 100%; }
      
      /* SCROLL HIJACK LAYER 1: Critical containment before React loads */
      /* v3 FIX: NO position:fixed on body - it caused blank screen bug */
      /* Scroll-locked state - prevents native scrolling via overflow:hidden */
      html.scroll-hijack-locked {
        overflow: hidden !important;
        overscroll-behavior: none !important;
        touch-action: none !important;
        -webkit-overflow-scrolling: auto !important;
      }
      html.scroll-hijack-locked body {
        overflow: hidden !important;
        /* REMOVED: position: fixed - THIS CAUSED BLANK SCREEN */
        overscroll-behavior: none !important;
        touch-action: none !important;
      }
      /* Scroll hijack sections - contain overflow from first paint */
      .scroll-hijack-section {
        overflow: hidden !important;
        contain: layout style paint !important;
        max-width: 100vw !important;
      }
      .scroll-hijack-section * {
        max-width: 100%;
      }
      /* Sentinel elements for anticipatory detection */
      .scroll-hijack-sentinel {
        position: absolute;
        top: -100px;
        left: 0;
        right: 0;
        height: 1px;
        pointer-events: none;
        visibility: hidden;
      }
    </style>

    <!--
      Currency preference, read before first paint.

      The prerendered crawler body states USD, and Vercel serves that static
      file to everyone. A returning visitor who chose GBP would otherwise see
      the USD number flash before React mounts and replaces it. This reads
      only the visitor's own explicit choice: no geolocation, no locale
      sniffing, no IP lookup.

      Crawlers have neither cookie nor param, so they resolve to "usd", match
      nothing below, and read the real price in the static body.
    -->
    <script>
      (function () {
        try {
          var param = new URLSearchParams(location.search).get('currency');
          var cookie = document.cookie.match(/(?:^|;\s*)mm_currency=([^;]*)/);
          var c = String(param || (cookie && cookie[1]) || 'usd').toLowerCase();
          if (c !== 'usd' && c !== 'gbp' && c !== 'aud') c = 'usd';
          document.documentElement.setAttribute('data-currency', c);
        } catch (e) {
          document.documentElement.setAttribute('data-currency', 'usd');
        }
      })();
    </script>
    <style>
      /* Hide only the stale number, never the sentence around it, and only
         for a visitor who actively chose something other than the default. */
      html:not([data-currency='usd']) #prerendered-content [data-price] {
        visibility: hidden;
      }
    </style>
