    <!-- The ground, before anything else.

         Every page here renders inside `.mm-site`, which paints the ink. This
         is the same colour, inline, so the first painted frame is already the
         right one: the built stylesheet is injected into this head *after* it,
         and it used to carry an off-white page ground that won and showed for
         seven hundred milliseconds on a cold load.

         This block used to be forty lines, styling a hand-written shell that
         stood in for the first screen. The pages are rendered from the
         components now, so the shell and its stylesheet are gone and this is
         all that is left of it. src/test/first-screen.test.ts keeps the value
         identical to `--mm-ink` in src/styles/mindmake.css. -->
    <style>html,body{margin:0;overflow-x:clip;max-width:100vw;background:#0a100d}#root{max-width:100vw}</style>
    <!-- The entrance: the page arrives once.

         Measured cold on a throttled phone, the first screen changed seven
         times in two seconds: fallback faces, a half-drawn wordmark, the
         poster popping into an empty plate, two font reflows, a hydration
         nudge and the film replacing its poster in a different tone. The
         causes are fixed at the root (preloads, metric fallbacks, a relative
         parallax, a crossfade). This holds the type and the curtain until the
         faces are in, or 700ms after the first frame, whichever is sooner, so
         what is left arrives as one event. The wait starts on the second
         animation frame, not the first: the first frame's callback runs
         before that frame is rasterised, which took 80 to 170ms measured, and
         the faces are usually in already, so the lift was beginning on a
         frame nobody had seen and the first frame on screen showed the top
         strips already going.

         Outside React on purpose: a class on <html> set before first paint is
         nothing the two trees can disagree about. No script means no class,
         and no class means nothing hidden and no curtain, which is the same
         guarantee the reveal primitive makes. Reduced motion and a deep link
         take the same path. `fonts.load()` in the first frame rather than
         `fonts.ready` here, because a ready promise taken before the
         stylesheet exists is a promise about a set with no faces in it.
         CURTAIN is the one switch: false keeps the type arrival alone.

         The root marker for the curtain is mm-covered, and the strips are
         .mm-curtain: two names on purpose. On 3 September the root carried
         the strips' own class name, so `.mm-curtain { display: none }` put
         the whole document out of render until the marker came off, 2.5
         seconds in on a throttled phone, and every reading taken that day
         was of that. The gate could not see it because it takes first paint
         from the browser, which reported the first frame it presented. -->
    <script>
      (function(){try{
        var CURTAIN=true;
        var d=document,h=d.documentElement;
        if(!d.fonts||!d.fonts.load||location.hash)return;
        if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
        h.classList.add("mm-pending");if(CURTAIN)h.classList.add("mm-covered");performance.mark("mm-pending");
        var done=false,go=function(){
          if(done)return;done=true;
          h.classList.remove("mm-pending");h.classList.add("mm-arrived");performance.mark("mm-arrived");
          setTimeout(function(){h.classList.remove("mm-covered")},1100);
        };
        requestAnimationFrame(function(){requestAnimationFrame(function(){
          Promise.all(['1em "Archivo Variable"','1em "Newsreader Variable"','1em "Source Serif 4 Variable"','1em "IBM Plex Mono"']
            .map(function(f){return d.fonts.load(f)})).then(go,go);
          setTimeout(go,700);
        })});
        setTimeout(go,4000);
      }catch(e){}})();
    </script>
