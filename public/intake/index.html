<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mindmaker · Before we begin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0e1512;--deep:#161b18;--panel:#18211d;
    --paper:#f2f0e9;--cream:#fbfaf7;
    --sage:#9aa8a2;--sage-dim:#6e7872;
    --mint:#57e0b8;--mint-deep:#147a5e;
    --muted:rgba(242,240,233,.6);--muted-2:rgba(242,240,233,.4);
    --line:rgba(87,224,184,.18);--field:rgba(242,240,233,.04);--field-focus:rgba(87,224,184,.06);
    --grad:linear-gradient(100deg,#147a5e 0%,#2bbf93 55%,#57e0b8 100%);
    --display:'Space Grotesk',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
    --mono:'Space Mono',ui-monospace,monospace;
    --p:0;--maxw:680px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--body);color:var(--paper);background:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  .bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(120% 90% at 50% -10%,#1a3b30 0%,#11241e 45%,#0c1714 100%);}
  .aurora{position:fixed;inset:-20%;z-index:-1;filter:blur(72px);opacity:calc(.2 + var(--p) * .5);transition:opacity 1.1s ease;pointer-events:none;}
  .aurora b{position:absolute;display:block;border-radius:50%;mix-blend-mode:screen;}
  .aurora .b1{width:46vw;height:46vw;left:-6vw;top:8vh;background:radial-gradient(circle,#147a5e,transparent 65%);animation:drift1 27s ease-in-out infinite;}
  .aurora .b2{width:52vw;height:52vw;right:-10vw;bottom:-6vh;background:radial-gradient(circle,#57e0b8,transparent 62%);opacity:calc(.3 + var(--p) * .6);transition:opacity 1.1s ease;animation:drift2 33s ease-in-out infinite;}
  @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(6vw,5vh)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-5vw,-4vh)}}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:clamp(20px,5vw,48px) 22px 56px;}
  .topbar{width:100%;max-width:var(--maxw);display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:30px;}
  .mark{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.32em;color:var(--paper);text-transform:uppercase;}
  .mark span{color:var(--mint);}
  .counter{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--muted-2);font-variant-numeric:tabular-nums;}
  .track{width:100%;max-width:var(--maxw);height:2px;background:var(--line);border-radius:2px;margin-top:14px;overflow:hidden;}
  .fill{height:100%;width:calc(var(--p) * 100%);background:var(--grad);transition:width .55s cubic-bezier(.2,.7,.2,1);border-radius:2px;}
  .stage{width:100%;max-width:var(--maxw);flex:1;display:flex;flex-direction:column;justify-content:center;padding:clamp(28px,7vh,72px) 0;}
  .card{transition:opacity .42s ease, transform .42s ease;}
  .card.leaving{opacity:0;transform:translateY(-10px);}
  .card.entering{opacity:0;transform:translateY(14px);}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mint);font-weight:400;margin:0 0 16px;}
  .eyebrow .stagelabel{color:var(--muted-2);}
  h1.q{font-family:var(--display);font-weight:500;font-size:clamp(26px,4.4vw,38px);line-height:1.16;letter-spacing:-.01em;margin:0 0 14px;color:var(--cream);}
  .help{font-size:14.5px;line-height:1.55;color:var(--muted);margin:0 0 24px;max-width:35em;}
  .opt{color:var(--muted-2);font-weight:400;}

  .chips{display:flex;flex-wrap:wrap;gap:10px;}
  .chip{border:1px solid var(--line);background:var(--field);color:var(--paper);border-radius:999px;padding:12px 18px;font-size:15px;font-family:var(--body);cursor:pointer;transition:all .16s;line-height:1.2;}
  .chip:hover{border-color:rgba(87,224,184,.5);transform:translateY(-1px);}
  .chip.on{background:var(--grad);color:#0c1714;border-color:transparent;font-weight:600;}
  .chip:focus-visible{outline:2px solid var(--mint);outline-offset:2px;}

  .ghost-add{margin-top:20px;background:transparent;border:0;color:var(--mint);font-family:var(--body);font-size:14px;cursor:pointer;padding:6px 0;letter-spacing:.01em;}
  .ghost-add:hover{color:#7df0cd;}
  .more-wrap{margin-top:16px;}
  .optlabel{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted-2);margin:0 0 9px;}
  .enrich-note{font-size:13.5px;line-height:1.5;color:var(--muted);margin:11px 0 0;}
  .enter-hint{display:block;margin-top:10px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted-2);}

  textarea{width:100%;min-height:128px;resize:vertical;color:var(--paper);background:var(--field);border:1px solid var(--line);border-radius:14px;padding:16px 17px;font-family:var(--body);font-size:16.5px;line-height:1.55;transition:border-color .2s, background .2s;}
  textarea.short{min-height:84px;}
  textarea::placeholder{color:var(--muted-2);}
  textarea:focus{outline:none;border-color:rgba(87,224,184,.55);background:var(--field-focus);box-shadow:0 0 0 4px rgba(87,224,184,.08);}

  .mic{margin-top:12px;display:inline-flex;align-items:center;gap:9px;background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 15px;color:var(--muted);font-family:var(--body);font-size:13.5px;cursor:pointer;transition:all .18s;}
  .mic:hover{color:var(--paper);border-color:rgba(87,224,184,.5);}
  .mic .dot{width:9px;height:9px;border-radius:50%;background:var(--muted-2);transition:background .2s;}
  .mic.rec{color:var(--mint);border-color:rgba(87,224,184,.55);}
  .mic.rec .dot{background:#ff6b6b;animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.4)}}

  .scale-num{font-family:var(--display);font-weight:500;font-size:clamp(72px,16vw,120px);line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center;margin:4px 0 4px;font-variant-numeric:tabular-nums;}
  .scale-of{font-family:var(--mono);text-align:center;color:var(--muted-2);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:28px;}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--mint) 0%,var(--mint) var(--rp,50%),rgba(255,255,255,.09) var(--rp,50%),rgba(255,255,255,.09) 100%);outline:none;cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--cream);border:0;box-shadow:0 4px 14px rgba(0,0,0,.4),0 0 0 6px rgba(87,224,184,.2);cursor:grab;}
  input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--cream);border:0;box-shadow:0 4px 14px rgba(0,0,0,.4),0 0 0 6px rgba(87,224,184,.2);cursor:grab;}
  .scale-ends{display:flex;justify-content:space-between;margin-top:14px;font-size:12.5px;color:var(--muted-2);}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .field.full{grid-column:1 / -1}
  .field label{display:block;font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 7px;}
  input[type=text],input[type=email]{width:100%;color:var(--paper);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-family:var(--body);font-size:15.5px;transition:border-color .2s,background .2s;}
  input[type=text]::placeholder,input[type=email]::placeholder{color:var(--muted-2);}
  input[type=text]:focus,input[type=email]:focus{outline:none;border-color:rgba(87,224,184,.55);background:var(--field-focus);box-shadow:0 0 0 4px rgba(87,224,184,.08);}
  .emailrow{margin-top:14px;}
  .morebox{margin-top:18px;}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;}

  .nav{display:flex;align-items:center;gap:16px;margin-top:32px;}
  .btn{font-family:var(--body);font-weight:600;font-size:15.5px;border:0;border-radius:12px;cursor:pointer;padding:14px 26px;transition:transform .15s, box-shadow .2s, opacity .2s;}
  .btn-primary{background:var(--grad);color:#0c1714;box-shadow:0 6px 22px rgba(87,224,184,.22);}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(87,224,184,.32);}
  .btn-ghost{background:transparent;color:var(--muted);padding:14px 6px;}
  .btn-ghost:hover{color:var(--paper);}
  .btn:focus-visible{outline:2px solid var(--mint);outline-offset:3px;}
  .skip{margin-left:auto;font-size:13.5px;color:var(--muted-2);}
  .skip:hover{color:var(--muted);}

  .welcome .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mint);margin:0 0 22px;opacity:0;animation:up .7s .15s forwards;}
  .welcome h1{font-family:var(--display);font-weight:600;font-size:clamp(30px,5.4vw,46px);line-height:1.14;letter-spacing:-.015em;margin:0 0 20px;color:var(--cream);opacity:0;animation:up .7s .28s forwards;}
  .welcome h1 em{font-style:normal;color:var(--mint);}
  .welcome p{font-size:16.5px;line-height:1.6;color:var(--muted);max-width:34em;margin:0 0 16px;opacity:0;animation:up .7s .42s forwards;}
  .welcome .meta{display:flex;gap:22px;flex-wrap:wrap;margin:26px 0 4px;opacity:0;animation:up .7s .56s forwards;}
  .welcome .meta div{font-size:13.5px;color:var(--muted-2);}
  .welcome .meta b{display:block;color:var(--paper);font-weight:600;font-size:14.5px;margin-bottom:2px;font-family:var(--body);}
  .welcome .start{opacity:0;animation:up .7s .7s forwards;}
  @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

  .done .seal{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mint);margin:0 0 18px;}
  .done h1{font-family:var(--display);font-weight:600;font-size:clamp(30px,5vw,42px);line-height:1.15;margin:0 0 18px;color:var(--cream);}
  .echo{background:var(--field);border:1px solid var(--line);border-left:3px solid var(--mint);border-radius:12px;padding:16px 18px;margin:6px 0 24px;}
  .echo .lab{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);margin-bottom:7px;}
  .echo .val{font-size:16px;line-height:1.5;color:var(--paper);}
  .done .status{font-size:16px;line-height:1.6;color:var(--muted);max-width:34em;margin:0 0 22px;}
  .done .status b{color:var(--paper);font-weight:600;}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(87,224,184,.25);border-top-color:var(--mint);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:9px;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .actions{display:flex;flex-wrap:wrap;gap:12px;}
  .toast{font-size:13.5px;color:var(--mint);margin-top:14px;min-height:18px;opacity:0;transition:opacity .3s;}
  .toast.show{opacity:1;}
  .foot{margin-top:40px;font-family:var(--mono);font-size:11.5px;color:var(--muted-2);letter-spacing:.06em;text-transform:uppercase;}

  @media (max-width:560px){.grid2{grid-template-columns:1fr;}.nav{flex-wrap:wrap;}.skip{margin-left:0;}}
  @media (prefers-reduced-motion: reduce){
    .aurora .b1,.aurora .b2{animation:none;}.card,.fill{transition:none;}
    .welcome *,.done *{animation:none !important;opacity:1 !important;}.spin,.mic.rec .dot{animation:none;}
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="aurora" aria-hidden="true"><b class="b1"></b><b class="b2"></b></div>
<div class="wrap">
  <div class="topbar"><div class="mark">MIND<span>MAKER</span></div><div class="counter" id="counter"></div></div>
  <div class="track" id="track" style="visibility:hidden"><div class="fill"></div></div>
  <div class="stage"><div class="card" id="card"></div></div>
</div>

<script>
/* ============================================================
   CONFIG: fill endpoint + anonKey after deploying submit-intake.
   anonKey is the publishable key, safe to ship in the page.
   If left unfilled, the page runs in manual mode (copy/download/email),
   so nothing breaks while previewing.
   ============================================================ */
const CONFIG = {
  endpoint: "https://bkyuxvschuwngtcdhsyg.functions.supabase.co/submit-intake",
  anonKey:  "sb_publishable_DDv1GyxEG09utDLjdWWz1A_JN-Z9eTp",
  notify:   "krish@themindmaker.ai",
  source:   "intake",
  voiceLang:"en-GB"
};

const params = new URLSearchParams(location.search);
const CLIENT = (params.get('name') || 'there').trim();
const CLIENT_SLUG = (params.get('c') || '').trim();
const ENGAGEMENT = (params.get('engagement') || 'your sprint').trim();

// Q4 is role-aware: the options shown depend on the seat picked in Q1.
// Each bank leads with high-leverage "only you can do this" work and ends with one or
// two genuinely dull tasks worth shedding. No inbox-clearing anywhere.
const SEAT_TASK_BANK = {
  "Founder or CEO":[
    "Turning a board deck into a defensible AI position","Pressure-testing strategy before I commit the company",
    "Drafting the investor and board narrative","Sizing a market or a bet before I back it",
    "Modelling scenarios I'd normally take to a consultant","Briefing and prepping for every meeting",
    "Chasing the status updates I need to run the week","Turning my scattered thinking into a written plan"],
  "Exec or department lead":[
    "Building the board or leadership update for my function","Turning team noise into a decision I can defend",
    "Drafting the strategy memo I keep putting off","Pulling numbers from five places into one view",
    "Prepping for the cross-functional meetings","Reviewing and editing the team's work",
    "Reporting up the chain every week","Researching a vendor or option before I rule on it"],
  "Team lead or manager":[
    "Coaching and giving feedback that actually lands","Turning my plan into briefs the team can run with",
    "Spotting where the team's about to get stuck","Pulling the weekly status together",
    "Writing the reports nobody reads but everyone needs","Chasing updates and stitching them into one picture",
    "Onboarding docs and process write-ups","Prepping one-to-ones and reviews"],
  "Operator or individual contributor":[
    "The deep work I'm best at, with the grind stripped out","Turning research into something I can act on",
    "First-pass analysis I'd normally do by hand","Pulling and cleaning data before I can use it",
    "Writing up what I did so others can follow","The repetitive production work in my role",
    "Formatting, tidying, and version-wrangling","Keeping trackers and docs current"],
  "Consultant or solo":[
    "Sharpening the thinking I actually sell","Turning a messy client brief into a clear scope",
    "Research and diligence on a new client or market","Drafting proposals and statements of work",
    "Building the deliverable from my notes","Pulling case studies and proof together",
    "Chasing the admin that eats billable time","Repackaging old work for a new client"],
  "Something else":[
    "The work only I can really do, with the busywork removed","Turning rough thinking into something finished",
    "Research and summarising before I decide","Pulling scattered information into one view",
    "Drafting the things I keep putting off","The repetitive parts of my week",
    "Reporting and status updates","Formatting, cleanup, and admin"]
};

// Q7 (ai_this_week) is role-aware. The first three chips are concrete, seat-specific AI
// behaviours; the last four are IDENTICAL across every seat so deriveAiPosture() can match
// on them ("didn't mention" / "leaned on it" = heavy; "didn't touch it" = none). Keep those
// four verbatim if you edit this bank.
const AI_WEEK_SHARED = ["Used it and didn't mention it to anyone","Leaned on it more than I'd admit in a meeting","Pasted something in and hoped the output was right","Didn't touch it once"];
const AI_WEEK_BANK = {
  "Founder or CEO":["Used it to sketch a strategy or board narrative","Had it model a scenario or a number","Had it brief me on something so I didn't have to",...AI_WEEK_SHARED],
  "Exec or department lead":["Drafted a memo or an update with it","Had it pull several sources into one view","Had it read or summarise something so I didn't have to",...AI_WEEK_SHARED],
  "Team lead or manager":["Used it to prep feedback or a one-to-one","Had it turn my notes into a brief the team can run","Had it read or summarise something so I didn't have to",...AI_WEEK_SHARED],
  "Operator or individual contributor":["Used it on the actual analysis, not just email","Had it clean or wrangle data before I used it","Asked it to draft or reword something",...AI_WEEK_SHARED],
  "Consultant or solo":["Used it to shape a client deliverable","Had it research a client or a market","Drafted or reworded something with it",...AI_WEEK_SHARED],
  "Something else":["Asked it to draft or reword something","Used it to pressure-test my own thinking","Had it read or summarise something so I didn't have to",...AI_WEEK_SHARED]
};

// Q9 (value_frame): same seven outcomes for every seat, just re-ordered so the one that
// tends to matter most for that seat sits first. A pick stays valid across seat changes.
const VALUE_FRAME_BANK = {
  "Founder or CEO":["A roadmap I actually trust","Confidence to lead AI calls","Shipping more without more people","One painful process gone for good","A system my team owns","Hours back every week","Finally visible and consistent"],
  "Exec or department lead":["A system my team owns","Confidence to lead AI calls","A roadmap I actually trust","Shipping more without more people","One painful process gone for good","Hours back every week","Finally visible and consistent"],
  "Team lead or manager":["A system my team owns","Hours back every week","One painful process gone for good","Shipping more without more people","Confidence to lead AI calls","A roadmap I actually trust","Finally visible and consistent"],
  "Operator or individual contributor":["Hours back every week","One painful process gone for good","Shipping more without more people","Confidence to lead AI calls","A system my team owns","Finally visible and consistent","A roadmap I actually trust"],
  "Consultant or solo":["Hours back every week","Shipping more without more people","Finally visible and consistent","One painful process gone for good","A roadmap I actually trust","Confidence to lead AI calls","A system my team owns"],
  "Something else":["Hours back every week","Shipping more without more people","A system my team owns","Finally visible and consistent","Confidence to lead AI calls","One painful process gone for good","A roadmap I actually trust"]
};

const questions = [
  { stage:"Your world", eyebrow:"Where to reach you", type:"email_capture", key:"work_email", optional:true,
    q:"What's your work email?",
    help:"So Krish can reach you before you meet. Use your work address and I'll do some homework on the company while you finish the rest.",
    ph:"you@company.com" },

  { stage:"Your world", eyebrow:"Your seat", type:"single", key:"seat", allowMore:true,
    q:"Which of these sounds most like you?",
    help:"Pick the closest. It just helps me pitch this at the right level.",
    options:["Founder or CEO","Exec or department lead","Team lead or manager","Operator or individual contributor","Consultant or solo","Something else"] },

  { stage:"Your world", eyebrow:"What you do", type:"text", key:"business", voice:true, prefillFromDossier:true,
    q:"In a line, what does the business actually do?",
    help:"Plain words beat polished ones. One line is plenty, or tap the mic and just say it.",
    ph: ctx => ctx.company ? "How you'd describe {company} to a stranger at dinner." : "We help X do Y. However you'd say it to a stranger at dinner." },

  { stage:"Your world", eyebrow:"Where the time goes", type:"multi", key:"time_goes", allowMore:true,
    q:"Where does your week actually go?",
    help:"Tap the big ones. The honest picture, not the tidy one.",
    options:["Email and comms","Meetings","Writing and content","Proposals and decks","Research","Admin and ops","Reporting and data","Sales and BD","Client delivery","Hiring and people","Planning and strategy","Putting out fires"] },

  { stage:"Your world", eyebrow:"What only you should be doing", type:"multi", key:"handoff", allowMore:true,
    q:"What could you stop doing if a machine did it well?",
    help: ctx => ctx.has('time_goes') ? "You said a lot of your week goes to {topTimeSink}. Which of these would you hand a machine first?" : "Two kinds of work to flag: the dull stuff that eats your day, and the high-value work you'd do more of if the busywork vanished.",
    options: ctx => SEAT_TASK_BANK[ctx.seat] || SEAT_TASK_BANK["Something else"] },

  { stage:"Where AI sits now", eyebrow:"A quick gut check", type:"scale", key:"confidence_now",
    q:"How confident are you making AI calls for your work today?",
    help:"Same scale Krish uses afterwards, so you can see how far you've come. Most people start a sprint around a four, that's the whole reason we do this. Drag to wherever it honestly sits.", ends:["Not at all","Completely"] },

  { stage:"Where AI sits now", eyebrow:"This week", type:"multi", key:"ai_this_week", allowMore:true,
    q:"What did you actually do with AI this week?",
    help:"Tap whatever's true, even the ones you'd rather not.",
    options: ctx => AI_WEEK_BANK[ctx.seat] || AI_WEEK_BANK["Something else"] },

  { stage:"Where AI sits now", eyebrow:"What hasn't stuck", type:"multi", key:"didnt_stick", allowMore:true,
    q:"Tried anything with AI that didn't stick?",
    help: ctx => ctx.aiPosture==='heavy' ? "You're clearly already using it. Anything you tried that didn't stick?" : (ctx.aiPosture==='none' ? "Even if this week was quiet, anything you tried before that fizzled?" : "No judgement. This tells me what to do differently."),
    options:["Prompts I copied off someone","A tool everyone raved about","An automation that broke","A course I didn't finish","Building my own GPT","Nothing's really stuck","Haven't properly tried yet"] },

  { stage:"What you want", eyebrow:"The one thing", type:"text", key:"north_star", voice:true,
    q:"If this nails one thing, what is it?",
    help:"The thing that would make it worth your time. One sentence or a ramble, both work. Tap the mic if it's easier to say.",
    ph:"Say it the way you'd say it to a friend, not a board." },

  { stage:"What you want", eyebrow:"What 'worth it' looks like", type:"single", key:"value_frame", allowMore:true,
    q:"What would make you say it paid for itself?",
    help: ctx => ctx.company ? "Pick the one that matters most for {company} right now." : "Pick the one that matters most right now.",
    options: ctx => VALUE_FRAME_BANK[ctx.seat] || VALUE_FRAME_BANK["Something else"] },

  { stage:"What you want", eyebrow:"A year from now", type:"multi", key:"aspiration", allowMore:true,
    q:"A year from now, where do you want to be with AI?",
    help: ctx => (ctx.llm && ctx.llm.aspiration_nudge) ? ctx.llm.aspiration_nudge : "Pick the ones that sound like the version of you you're after. This is the target Krish measures the work against.",

const state = { step:-1, answers:{}, contact:{ name:"",role:"",company:"",email:"",link:"",note:"",hp:"" },
  enrich:{ status:"idle", started:false, fullStarted:false, personalized:false, domain:null,
    company:null, industry:null, tagline:null, descriptor:null, stack:null, news:null, llm:null } };
const card = document.getElementById('card');
const counter = document.getElementById('counter');
const track = document.getElementById('track');
const root = document.documentElement;
const total = questions.length;
const startedAt = Date.now();
const pad = n => String(n).padStart(2,'0');
const findKey = k => questions.findIndex(q=>q.key===k);
const hasSR = !!(window.SpeechRecognition || window.webkitSpeechRecognition);

function chipState(i){
  if(typeof state.answers[i] !== 'object' || state.answers[i]===null){
    state.answers[i] = { picked: questions[i].type==='multi' ? [] : "", more:"" };
  }
  return state.answers[i];
}
function valByKey(k){
  const i=findKey(k); if(i<0) return null; const q=questions[i];
  if(q.type==='text') return (state.answers[i]||"").trim() || null;
  if(q.type==='single'){ const p=chipState(i).picked; return p||null; }
  if(q.type==='multi'){ const p=chipState(i).picked; return (p&&p.length)?p:null; }
  if(q.type==='scale') return state.answers[i]!=null?state.answers[i]:null;
  return null;
}
// ── Context resolver ───────────────────────────────────────────────────────
// Any question field (q / help / ph / options) may be a plain value or a function of
// ctx. ctx blends the dossier (safe fields only, never scale.*) with the user's own
// earlier answers. fill() interpolates {tokens} and is a safety net only: a resolver
// that needs a fact must branch on its presence and return fully generic copy when it
// is missing, so nothing ever renders half-personalised.
function fill(str,ctx){ return (str||"").replace(/\{(\w+)\}/g,(_,k)=>escapeHtml(ctx[k]!=null?String(ctx[k]):'')); }
function resolve(field,ctx){
  const v = (typeof field==='function') ? field(ctx) : field;
  if(v==null) return v;
  return Array.isArray(v) ? v : fill(String(v),ctx);
}
function deriveFirstName(){
  if(CLIENT!=='there') return CLIENT.split(/\s+/)[0];
  const g = guessNameFromEmail(state.contact.email);
  return g ? g.split(' ')[0] : null;
}
// heavy = admits hidden/heavy use; none = only "didn't touch it"; light = some use.
// Matches the anchor lanes kept verbatim across every AI_WEEK_BANK seat variant.
function deriveAiPosture(){
  const p = valByKey('ai_this_week'); if(!p || !p.length) return null;
  const didnt = p.some(x=>/didn.t touch/i.test(x));
  const heavy = p.some(x=>/didn.t mention|leaned on it/i.test(x));
  const others = p.filter(x=>!/didn.t touch/i.test(x));
  if(didnt && others.length===0) return 'none';
  if(heavy || others.length>=3) return 'heavy';
  return 'light';
}
function buildCtx(){
  const e = state.enrich;
  const tg = valByKey('time_goes');
  return {
    company:e.company, industry:e.industry, tagline:e.tagline,
    descriptor:e.descriptor, stack:(e.stack&&e.stack.length?e.stack:null), news:e.news, domain:e.domain,
    firstName:deriveFirstName(),
    seat:valByKey('seat'),
    topTimeSink:(tg&&tg.length?tg[0]:null),
    aiPosture:deriveAiPosture(),
    northStar:valByKey('north_star'),
    get:k=>valByKey(k),
    has:k=>valByKey(k)!=null,
    llm:e.llm||null
  };
}
// Copy ONLY the view-safe allowlist off an enrichment response. dossier.scale.* (employee
// count, size band, rank, icp, mode) is internal routing and is never read into state.
function copySafe(d){
  if(!d) return;
  const id=d.identity||{}, u=d.understanding||{};
  if(id.name) state.enrich.company=id.name;
  if(u.industry) state.enrich.industry=u.industry;
  if(u.tagline) state.enrich.tagline=u.tagline;
  if(u.descriptor) state.enrich.descriptor=u.descriptor;
  if(Array.isArray(u.stack)&&u.stack.length) state.enrich.stack=u.stack;
  if(Array.isArray(d.currency)&&d.currency[0]&&d.currency[0].text) state.enrich.news=d.currency[0].text;
}
// Guardrail for auto-pulled company copy. Enrichment often hands back a full marketing
// blurb or an SEO description with a "Discover how we..." CTA tail. The business field asks
// for one line, so prefill at most the first real sentence, drop an obvious CTA tail, and if
// it still is not a line (>160 chars), prefill nothing rather than dump a truncated paragraph.
function cleanDescriptor(s){
  if(!s) return '';
  let t = String(s).replace(/\s+/g,' ').trim();
  const m = t.match(/^.*?[.!?](?=\s|$)/);
  if(m && m[0].trim().length >= 40) t = m[0].trim();
  t = t.replace(/\s+(discover|learn more|find out|explore|contact us|get in touch|read more|see how|sign up|book a|start your|join us)\b.*$/i, '').trim();
  t = t.replace(/[\s,;:.–—-]+$/,'').trim();
  return t.length > 160 ? '' : t;
}
// The reflective note under the business textarea: the generated one-liner when the
// personalise call produced one, else the plain "pulled from your domain" line.
function dossierNote(){
  const llm = state.enrich.llm;
  if(llm && llm.business_reflect) return `<p class="enrich-note" id="enrich-note">${escapeHtml(llm.business_reflect)}</p>`;
  return `<p class="enrich-note" id="enrich-note">I pulled this from ${escapeHtml(state.enrich.domain||'your domain')}. Fix anything I got wrong.</p>`;
}
function setProgress(){
  let p=0; if(state.step>=0 && state.step<total) p=state.step/total; if(state.step>=total) p=1;
  root.style.setProperty('--p', p.toFixed(3));
}
function show(html){
  card.classList.add('leaving');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const swap = () => {
    card.innerHTML = html;
    card.classList.remove('leaving'); card.classList.add('entering');
    requestAnimationFrame(()=>requestAnimationFrame(()=>card.classList.remove('entering')));
    wire();
    window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});
  };
  reduce ? swap() : setTimeout(swap, 300);
}
function welcome(){
  counter.textContent=""; track.style.visibility="hidden"; setProgress();
  const hi = CLIENT==='there' ? 'Hi there' : escapeHtml(CLIENT);
  show(`<div class="welcome">
    <p class="kicker">Before we begin · about four minutes</p>
    <h1>${hi}, before ${escapeHtml(ENGAGEMENT)} starts, I want to <em>understand your world</em>.</h1>
    <p>The sharper my picture of you going in, the less of our time we spend on setup and the more we spend on real work. Think of this as where your working brain starts.</p>
    <p>It's mostly quick taps, with a few optional boxes if you feel like saying more. ${hasSR?'Prefer talking? Tap the mic on any box and just speak.':''}</p>
    <p>There are no wrong answers here. The messier and more honest, the more useful it is to me.</p>
    <div class="meta">
      <div><b>Mostly taps</b>A few optional boxes</div>
      <div><b>About four minutes</b>Faster if you skip the deep ones</div>
      <div><b>Nothing wasted</b>I read it to prep, not to grade</div>
    </div>
    <div class="start"><div class="nav"><button class="btn btn-primary" id="begin">Begin</button></div></div>
  </div>`);
}
function render(inPlace){
  if(state.step<0) return welcome();
  if(state.step>=total) return done();
  const q = questions[state.step];
  const ctx = buildCtx();
  const qText = resolve(q.q, ctx);
  const helpText = resolve(q.help, ctx);
  counter.textContent = `${pad(state.step+1)} / ${pad(total)}`;
  track.style.visibility="visible"; setProgress();
  const head = `<p class="eyebrow">${escapeHtml(q.eyebrow)} <span class="stagelabel">· ${escapeHtml(q.stage)}</span></p>
    <h1 class="q">${qText}</h1>${helpText?`<p class="help">${helpText}</p>`:''}`;
  let body="";

  if(q.type==="multi" || q.type==="single"){
    const options = resolve(q.options, ctx) || [];
    const cs = chipState(state.step);
    if(Array.isArray(cs.picked)) cs.picked = cs.picked.filter(v=>options.includes(v));
    else if(cs.picked && !options.includes(cs.picked)) cs.picked = "";
    const on = v => q.type==='multi' ? cs.picked.includes(v) : cs.picked===v;
    body = `<div class="chips">${options.map(o=>
      `<button class="chip ${on(o)?'on':''}" data-val="${escapeAttr(o)}">${escapeHtml(o)}</button>`).join('')}</div>`;
    if(q.allowMore){
      const open = cs.more && cs.more.length;
      body += `<button class="ghost-add" id="addmore" ${open?'hidden':''}>+ ${q.moreLabel?escapeHtml(q.moreLabel):'Add your own words'}</button>
        <div class="more-wrap" id="morewrap" ${open?'':'hidden'}>
          <p class="optlabel">${q.moreLabel?escapeHtml(q.moreLabel):'In your own words (optional)'}</p>
          <textarea id="ta" class="short" placeholder="${escapeAttr(q.morePh||'Anything you want to add.')}">${escapeHtml(cs.more||'')}</textarea>
          ${hasSR?micHtml():''}
        </div>`;
    }
  } else if(q.type==="scale"){
    const v = state.answers[state.step] != null ? state.answers[state.step] : 5;
    body = `<div class="scale-num" id="snum">${v}</div>
      <div class="scale-of">out of 10</div>
      <input type="range" id="rng" min="1" max="10" step="1" value="${v}">
      <div class="scale-ends"><span>${q.ends[0]}</span><span>${q.ends[1]}</span></div>`;
  } else if(q.type==="email_capture"){
    body = `<div class="field"><input type="email" id="c_email_early" value="${escapeAttr(state.contact.email)}" placeholder="${escapeAttr(resolve(q.ph, ctx)||'you@company.com')}"></div>
      <span class="enter-hint">↵ to continue</span>`;
  } else if(q.type==="text"){
    let v = state.answers[state.step] || "";
    let noteHtml = "";
    if(q.prefillFromDossier){
      const desc = cleanDescriptor(state.enrich.descriptor || state.enrich.tagline);
      if(!v && state.enrich.status==="ready" && desc){
        v = desc; state.answers[state.step] = v;
      }
      if(!v && state.enrich.status==="loading"){
        noteHtml = `<p class="enrich-note" id="enrich-note"><span class="spin"></span>Reading ${escapeHtml(state.enrich.company||state.enrich.domain||'the company')}…</p>`;
      } else if(state.enrich.status==="ready" && desc && v===desc){
        noteHtml = dossierNote();
      }
    }
    body = `<textarea id="ta" placeholder="${escapeAttr(resolve(q.ph, ctx)||'')}">${escapeHtml(v)}</textarea>${noteHtml}<span class="enter-hint">↵ to continue · ⇧↵ for a new line</span>${hasSR?micHtml():''}`;
  } else if(q.type==="contact"){
    const c = state.contact;
    const seat = valByKey('seat');
    const nameV = c.name || guessNameFromEmail(c.email);
    const roleV = c.role || (seat && seat!=='Something else' ? seat : '');
    const coV   = c.company || state.enrich.company || '';
    const linkV = c.link || state.enrich.domain || '';
    body = `<div class="grid2">
        <div class="field"><label>Your name</label><input type="text" id="c_name" value="${escapeAttr(nameV)}" placeholder="First and last"></div>
        <div class="field"><label>Role or title</label><input type="text" id="c_role" value="${escapeAttr(roleV)}" placeholder="Founder, Head of..."></div>
        <div class="field"><label>Company</label><input type="text" id="c_co" value="${escapeAttr(coV)}" placeholder="Where you work"></div>
        <div class="field"><label>Email</label><input type="email" id="c_email" value="${escapeAttr(c.email)}" placeholder="you@company.com"></div>
      </div>
      <div class="field emailrow"><label>A link that shows your world <span class="opt">(optional)</span></label><input type="text" id="c_link" value="${escapeAttr(linkV)}" placeholder="Site, LinkedIn, or a talk, so I can do my homework"></div>
      <div class="field morebox"><label>Anything else I should know <span class="opt">(optional)</span></label><textarea id="c_note" class="short" placeholder="Context, sensitivities, a person to loop in, a hard no. Or leave it blank.">${escapeHtml(c.note)}</textarea></div>
      <input class="hp" id="hp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" placeholder="Leave empty">
      <div class="toast" id="toast"></div>`;
  }

  const isLast = state.step === total-1;
  const backBtn = state.step>0 ? `<button class="btn btn-ghost" id="back">Back</button>` : '';
  const skip = (q.optional || q.type==='multi' || q.type==='single') ? `<button class="btn btn-ghost skip" id="skip">Skip</button>` : '';
  const nav = `<div class="nav">${backBtn}<button class="btn btn-primary" id="next">${isLast?'Send it to Krish':'Next'}</button>${skip}</div>`;
  const html = `<div class="card-inner">${head}${body}${nav}</div>`;
  inPlace ? swapInPlace(html) : show(html);
}
function swapInPlace(html){ card.innerHTML = html; wire(); }
function micHtml(){ return `<button class="mic" id="mic"><span class="dot"></span><span class="mlabel">Talk instead</span></button>`; }

function advance(){
  capture();
  const q = questions[state.step];
  if(q && q.type==='email_capture') kickEnrichment(state.contact.email);
  if(q && q.type==='contact' && !state.contact.name){
    toast("Just your name, so I know who I'm prepping for."); const n=card.querySelector('#c_name'); if(n) n.focus(); return;
  }
  state.step++; render();
}

// Mirrors the Diagnosis Room's enrichment: turn a work email into a one-line company
// descriptor to prefill Q2. Reads only identity.name + understanding.descriptor/tagline;
// never reads dossier.scale.* (internal routing). Free-email / errors skip silently.
function kickEnrichment(email){
  if(state.enrich.started) return;
  const m = (email||"").trim().toLowerCase();
  if(!m.includes('@')) return;
  const domain = m.split('@')[1] || '';
  if(!domain) return;
  state.enrich.started = true; state.enrich.status = "loading"; state.enrich.domain = domain;
  fetch(enrichUrl(), { method:"POST",
    headers:{ "Content-Type":"application/json", "apikey":CONFIG.anonKey, "Authorization":"Bearer "+CONFIG.anonKey },
    body: JSON.stringify({ email:m, depth:"identity" }) })
    .then(r=>r.json())
    .then(d=>{
      if(!d || d.skipped || d.error){ state.enrich.status="skipped"; reResolveStep(); return; }
      copySafe(d);
      state.enrich.status = (state.enrich.descriptor||state.enrich.tagline) ? "ready" : "skipped";
      reResolveStep();
      kickEnrichFull(domain);
      kickPersonalize();
    })
    .catch(()=>{ state.enrich.status="error"; reResolveStep(); });
}
function enrichUrl(){ return CONFIG.endpoint.replace('submit-intake','enrich-company'); }
// Background upgrade to the full dossier (~9s): descriptor, stack, recent news, for the later
// "Where AI sits" / "What you want" questions. Fails silently; the identity copy stands.
function kickEnrichFull(domain){
  if(state.enrich.fullStarted || !domain) return;
  state.enrich.fullStarted = true;
  fetch(enrichUrl(), { method:"POST",
    headers:{ "Content-Type":"application/json", "apikey":CONFIG.anonKey, "Authorization":"Bearer "+CONFIG.anonKey },
    body: JSON.stringify({ domain, depth:"full" }) })
    .then(r=>r.json())
    .then(d=>{ if(!d || d.skipped || d.error) return; copySafe(d);
      if(state.enrich.status!=="ready" && (state.enrich.descriptor||state.enrich.tagline)) state.enrich.status="ready";
      reResolveStep(); })
    .catch(()=>{});
}
// One up-front generative pass: turns the safe dossier into a couple of bespoke, voice-linted
// fragments (a business reflection, an aspiration nudge). Sends ONLY safe fields, never scale.*.
// Fire-and-forget: any failure or off-voice fragment leaves the deterministic copy in place.
function kickPersonalize(){
  if(state.enrich.personalized) return;
  const e = state.enrich;
  if(!e.company && !e.industry && !e.descriptor && !e.tagline) return;
  state.enrich.personalized = true;
  const safe = { company:e.company, industry:e.industry, tagline:e.tagline, descriptor:e.descriptor, stack:e.stack, news:e.news };
  fetch(CONFIG.endpoint.replace('submit-intake','personalize-intake'), { method:"POST",
    headers:{ "Content-Type":"application/json", "apikey":CONFIG.anonKey, "Authorization":"Bearer "+CONFIG.anonKey },
    body: JSON.stringify({ safe, seat: valByKey('seat')||null }) })
    .then(r=>r.json())
    .then(d=>{ if(!d || d.error || !d.fragments) return; state.enrich.llm = d.fragments; reResolveStep(); })
    .catch(()=>{});
}
// Async dossier / fragment arrival: refresh whatever the current step shows without clobbering
// anything the user is typing. Text steps patch in place (focus/caret safe); chip steps
// re-render from state (picks live in chipState, so they survive).
function reResolveStep(){
  if(state.step<0 || state.step>=total) return;
  const q = questions[state.step]; if(!q) return;
  if(q.type==='text'){ applyDossierPrefill(); return; }
  const ae = document.activeElement;
  if(ae && (ae.tagName==='TEXTAREA' || ae.tagName==='INPUT') && card.contains(ae)) return;
  capture();
  render(true);
}
// Late arrival on the business step: prefill the empty textarea and patch the reflective note.
function applyDossierPrefill(){
  const q = questions[state.step]; if(!q || !q.prefillFromDossier) return;
  const ta = card.querySelector('#ta'); const note = card.querySelector('#enrich-note');
  const desc = cleanDescriptor(state.enrich.descriptor || state.enrich.tagline);
  if(state.enrich.status==="ready" && desc){
    if(ta && ta.value.trim()===''){ ta.value = desc; state.answers[state.step] = desc; }
    const llm = state.enrich.llm;
    const inner = (llm && llm.business_reflect)
      ? escapeHtml(llm.business_reflect)
      : `I pulled this from ${escapeHtml(state.enrich.domain||'your domain')}. Fix anything I got wrong.`;
    if(note){ note.innerHTML = inner; }
    else if(ta){ ta.insertAdjacentHTML('afterend', `<p class="enrich-note" id="enrich-note">${inner}</p>`); }
  } else if(note){ note.remove(); }
}
// Best-effort first/last name from a work email's local part. Conservative: only when it
// clearly looks like first.last (two+ alpha parts), and never for shared mailboxes.
function guessNameFromEmail(email){
  const local = (email||"").trim().toLowerCase().split('@')[0] || '';
  if(!local) return '';
  if(/^(info|hello|hi|hey|team|admin|sales|support|contact|founder|founders|office|mail|enquiries|inquiries|press|pr|jobs|careers|hr|account|accounts|billing|noreply|no-reply)$/.test(local)) return '';
  const parts = local.split(/[._-]+/).filter(p=>/^[a-z]{2,}$/.test(p));
  if(parts.length < 2 || parts.length > 3) return '';
  return parts.map(p=>p[0].toUpperCase()+p.slice(1)).join(' ');
}
// Enter advances the form. Shift+Enter is a newline in textareas; a focused chip/button
// keeps its native behaviour (toggle/click); welcome Enter begins.
function onKeydown(e){
  if(e.key!=='Enter') return;
  const el = e.target;
  if(state.step<0){ if(el && el.tagName==='BUTTON') return; const b=card.querySelector('#begin'); if(b){ e.preventDefault(); b.click(); } return; }
  if(state.step>=total) return;
  if(el && el.tagName==='BUTTON') return;
  if(el && el.tagName==='TEXTAREA'){
    // The contact step's notes box is free-form — let Enter be a newline there.
    if(questions[state.step] && questions[state.step].type==='contact') return;
    if(e.shiftKey) return; e.preventDefault(); advance(); return;
  }
  e.preventDefault(); advance();
}

function wire(){
  const begin = card.querySelector('#begin'); if(begin) begin.onclick=()=>{ state.step=0; render(); };
  const next = card.querySelector('#next'); if(next) next.onclick=advance;
  const back = card.querySelector('#back'); if(back) back.onclick=()=>{ capture(); state.step--; render(); };
  const skip = card.querySelector('#skip'); if(skip) skip.onclick=()=>{ state.step++; render(); };

  card.querySelectorAll('.chip[data-val]').forEach(ch=>{
    ch.onclick=()=>{ const v=ch.dataset.val; const q=questions[state.step]; const cs=chipState(state.step);
      if(q.type==='multi'){ const k=cs.picked.indexOf(v); if(k>=0) cs.picked.splice(k,1); else cs.picked.push(v); ch.classList.toggle('on'); }
      else { cs.picked = cs.picked===v ? "" : v; card.querySelectorAll('.chip[data-val]').forEach(x=>x.classList.toggle('on', x.dataset.val===cs.picked)); }
    };
  });
  const addmore = card.querySelector('#addmore');
  if(addmore) addmore.onclick=()=>{ const w=card.querySelector('#morewrap'); w.hidden=false; addmore.hidden=true;
    const t=w.querySelector('#ta'); if(t) t.focus({preventScroll:true}); };

  const rng = card.querySelector('#rng');
  if(rng){ const num=card.querySelector('#snum'); const min=Number(rng.min), max=Number(rng.max);
    const paint=()=>{ const pct=((rng.value-min)/(max-min))*100; rng.style.setProperty('--rp',pct+'%'); num.textContent=rng.value;
      state.answers[state.step]=Number(rng.value); };
    rng.addEventListener('input', paint); paint(); }

  const mic = card.querySelector('#mic'); const ta = card.querySelector('#ta');
  if(mic && ta) attachVoice(ta, mic);
  if(questions[state.step] && questions[state.step].type==='text' && ta && state.step>0)
    setTimeout(()=>ta.focus({preventScroll:true}),120);
  if(questions[state.step] && questions[state.step].type==='email_capture'){
    const ee=card.querySelector('#c_email_early'); if(ee) setTimeout(()=>ee.focus({preventScroll:true}),120); }
}
function capture(){
  const q=questions[state.step]; if(!q) return;
  if(q.type==='email_capture'){ const el=card.querySelector('#c_email_early'); if(el) state.contact.email=el.value.trim(); }
  if(q.type==='text'){ const ta=card.querySelector('#ta'); if(ta) state.answers[state.step]=ta.value.trim(); }
  if((q.type==='multi'||q.type==='single') && q.allowMore){ const ta=card.querySelector('#ta'); if(ta) chipState(state.step).more=ta.value.trim(); }
  if(q.type==='scale'){ const rng=card.querySelector('#rng'); if(rng) state.answers[state.step]=Number(rng.value); }
  if(q.type==='contact'){
    const g=id=>{const el=card.querySelector(id);return el?el.value.trim():"";};
    state.contact.name=g('#c_name'); state.contact.role=g('#c_role'); state.contact.company=g('#c_co');
    state.contact.email=g('#c_email'); state.contact.link=g('#c_link'); state.contact.note=g('#c_note'); state.contact.hp=g('#hp');
  }
}
function attachVoice(ta, btn){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ btn.style.display='none'; return; }
  let rec=null, recording=false, base='';
  const label = btn.querySelector('.mlabel');
  const stopUi=()=>{ recording=false; btn.classList.remove('rec'); label.textContent='Talk instead'; };
  btn.onclick=()=>{
    if(recording){ try{rec.stop();}catch(e){} return; }
    rec = new SR(); rec.continuous=true; rec.interimResults=true; rec.lang=CONFIG.voiceLang;
    base = ta.value ? ta.value.trim()+' ' : '';
    let finalText='';
    rec.onresult=(e)=>{ let interim='';
      for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript;
        if(e.results[i].isFinal) finalText+=t+' '; else interim+=t; }
      ta.value = base + finalText + interim; };
    rec.onend=()=>{ base=ta.value.trim()+' '; stopUi(); };
    rec.onerror=()=>stopUi();
    try{ rec.start(); recording=true; btn.classList.add('rec'); label.textContent='Listening, tap to stop'; }
    catch(e){ stopUi(); }
  };
}

function done(){
  counter.textContent="Done"; setProgress();
  const ns = valByKey('north_star');
  const who = state.contact.name ? state.contact.name : (CLIENT==='there'?'':escapeHtml(CLIENT));
  let echoBlock="";
  if(ns){ echoBlock = `<div class="echo"><div class="lab">What you want this to nail</div><div class="val">${escapeHtml(ns)}</div></div>`; }
  show(`<div class="done">
    <p class="seal">That's everything</p>
    <h1>Thank you${who?`, ${escapeHtml(who)}`:''}.</h1>
    ${echoBlock}
    <p class="status" id="status"></p>
    <div class="actions" id="actions"></div>
    <div class="toast" id="toast"></div>
    <p class="foot">Mindmaker · the work survives the engagement</p>
  </div>`);
  const configured = !CONFIG.endpoint.includes("PROJECT_REF") && !CONFIG.anonKey.includes("ANON");
  if(configured) submit(); else manualMode("You're all set. Send this to Krish below and he'll have it before you meet.");
}
function setStatus(html){ const s=card.querySelector('#status'); if(s) s.innerHTML=html; }
function setActions(html){ const a=card.querySelector('#actions'); if(a) a.innerHTML=html; }
function toast(m){ const t=card.querySelector('#toast'); if(!t) return; t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2800); }

async function submit(){
  setStatus(`<span class="spin"></span>Sending your intake to Krish...`); setActions("");
  try{
    const res = await fetch(CONFIG.endpoint, {
      method:"POST",
      headers:{ "Content-Type":"application/json", "apikey":CONFIG.anonKey, "Authorization":"Bearer "+CONFIG.anonKey },
      body: JSON.stringify(buildPayload())
    });
    if(!res.ok) throw new Error("status "+res.status);
    setStatus(`Your intake is with Krish, and he'll read it before you meet. <b>Thank you.</b>`);
    setActions(`<button class="btn btn-ghost" id="dl">Download a copy for yourself</button>`); bindDownload();
  }catch(e){
    setStatus(`I couldn't reach the server just now, but <b>nothing you shared is lost.</b> Send it to Krish below.`);
    manualButtons();
  }
}
function manualMode(msg){ setStatus(msg); manualButtons(); }
function manualButtons(){
  setActions(`<button class="btn btn-primary" id="copy">Copy my answers</button>
    <button class="btn btn-ghost" id="dl">Download as a file</button>
    <button class="btn btn-ghost" id="mail">Open an email to Krish</button>`);
  const copy=card.querySelector('#copy');
  if(copy) copy.onclick=async()=>{ const t=buildTranscript();
    try{ await navigator.clipboard.writeText(t); }catch(e){ fallbackCopy(t); } toast("Copied. Paste it into a message or email to Krish."); };
  bindDownload();
  const mail=card.querySelector('#mail');
  if(mail) mail.onclick=()=>{ const c=state.contact;
    const subj=encodeURIComponent(`Mindmaker intake${c.name?` from ${c.name}`:''}${c.company?` (${c.company})`:''}`);
    window.location.href=`mailto:${CONFIG.notify}?subject=${subj}&body=${encodeURIComponent(buildTranscript())}`;
    toast("If your email opens blank or cut off, use Copy instead."); };
}
function bindDownload(){ const dl=card.querySelector('#dl'); if(!dl) return;
  dl.onclick=()=>{ const c=state.contact; const blob=new Blob([buildTranscript()],{type:'text/plain'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`mindmaker-intake-${(c.name||CLIENT||'client').toLowerCase().replace(/[^a-z0-9]+/g,'-')}.txt`;
    a.click(); toast("Downloaded."); }; }

function buildPayload(){
  const c=state.contact; const responses=[];
  questions.forEach((q,i)=>{
    if(q.type==='contact' || q.type==='email_capture') return;
    let entry={ stage:q.stage, eyebrow:q.eyebrow, question:q.q, type:q.type, key:q.key||null };
    if(q.type==='multi'||q.type==='single'){ const cs=chipState(i); entry.picked=cs.picked; entry.more=cs.more||""; }
    else if(q.type==='scale'){ entry.value=(state.answers[i]!=null?state.answers[i]:null); }
    else if(q.type==='text'){ entry.value=state.answers[i]||""; }
    responses.push(entry);
  });
  return {
    source:CONFIG.source, client_slug:CLIENT_SLUG||null,
    name:c.name||null, role:c.role||null, company:c.company||null, email:c.email||null, link:c.link||null,
    seat: valByKey('seat'),
    confidence_now: valByKey('confidence_now'),
    business_oneliner: valByKey('business'),
    north_star: valByKey('north_star'),
    value_frame: valByKey('value_frame'),
    wish: valByKey('wish'),
    anything_else: c.note||null,
    responses, website: c.hp || "",
    meta: { user_agent:navigator.userAgent, submitted_at:new Date().toISOString(), duration_ms:Date.now()-startedAt, engagement:ENGAGEMENT }
  };
}
function buildTranscript(){
  const c=state.contact; const L=[];
  L.push("MINDMAKER intake");
  if(c.name) L.push(`Name: ${c.name}${c.role?`, ${c.role}`:''}${c.company?` (${c.company})`:''}`);
  if(c.email) L.push(`Email: ${c.email}`); if(c.link) L.push(`Link: ${c.link}`);
  L.push(new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})); L.push("");
  const cf=valByKey('confidence_now'); if(cf!=null) L.push(`AI confidence today: ${cf}/10`);
  L.push("");
  questions.forEach((q,i)=>{
    if(q.type==='contact'||q.type==='scale'||q.type==='email_capture') return;
    L.push(q.eyebrow.toUpperCase()); L.push(q.q);
    if(q.type==='multi'||q.type==='single'){ const cs=chipState(i);
      const picked = Array.isArray(cs.picked)? cs.picked : (cs.picked?[cs.picked]:[]);
      L.push(picked.length?picked.join(', '):"(skipped)");
      if(cs.more) L.push(`Added: ${cs.more}`);
    } else { const v=state.answers[i]; L.push(v&&v.length?v:"(skipped)"); }
    L.push("");
  });
  if(c.note){ L.push("ANYTHING ELSE"); L.push(c.note); L.push(""); }
  return L.join("\n");
}
function fallbackCopy(text){ const t=document.createElement('textarea'); t.value=text; document.body.appendChild(t);
  t.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(t); }
function escapeHtml(s){return (s||"").replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function escapeAttr(s){return (s||"").replace(/"/g,'&quot;').replace(/</g,'&lt;');}

card.addEventListener('keydown', onKeydown); welcome(); wire();
</script>
