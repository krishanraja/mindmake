<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Mindmake / leadership dividend decision console</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="console-shell">
      <header class="console-head">
        <div><h1>Homepage leadership dividend</h1><p>Practice, AI Brain benefits and the returned hour in one bounded review.</p></div>
        <div class="save-state" aria-live="polite"><i></i><span>Saved locally</span></div>
      </header>
      <section class="console-workspace">
        <div class="preview-pane">
          <header class="preview-toolbar">
            <div class="device-switch" role="group" aria-label="Preview device"><button type="button" data-device="desktop" class="is-active">Desktop</button><button type="button" data-device="mobile">Mobile</button></div>
            <div class="mode-switch" role="group" aria-label="Preview chapter"><button type="button" data-mode="practice" class="is-active">Practice</button><button type="button" data-mode="benefits">Benefits</button><button type="button" data-mode="return">Returned hour</button></div>
          </header>
          <div class="preview-stage" data-device-view="desktop">
            <article class="device-frame device-desktop" aria-label="Desktop leadership-dividend preview">
              <section class="dividend-frame" data-mode-view="practice">
                <article class="dividend-panel practice-panel" data-panel="practice">
                  <figure><img data-practice-image alt="Illustrative decision machinery" /><div></div></figure>
                  <header data-focus-region="intro"><p data-optional-copy="practiceLabel"></p><h2 data-copy="practiceHeadline"></h2></header>
                  <div class="practice-copy" data-focus-region="story"><span data-practice-count></span><h3 data-practice-title></h3><p data-practice-copy></p></div>
                  <nav class="practice-controls" data-focus-region="controls" aria-label="Practice stages"><button type="button" data-practice="0">Notice</button><button type="button" data-practice="1">Connect</button><button type="button" data-practice="2">Prepare</button></nav>
                </article>
                <article class="dividend-panel benefits-panel" data-panel="benefits">
                  <figure><img src="../../case-study-browsing/media/evidence-connects-loop-r01-20s-720p-web-sealed-poster.webp" alt="Illustrative connecting machinery" /><div></div></figure>
                  <div class="benefit-copy" data-focus-region="benefit"><p data-optional-copy="benefitLabel"></p><span data-benefit-count></span><h2 data-benefit-title></h2><div data-benefit-copy></div></div>
                  <nav class="benefit-controls" data-focus-region="controls" aria-label="AI Brain benefits"><button type="button" data-benefit-prev aria-label="Previous benefit">←</button><i></i><button type="button" data-benefit-next aria-label="Next benefit">→</button></nav>
                </article>
                <article class="dividend-panel return-panel" data-panel="return">
                  <div class="return-copy" data-focus-region="return"><p data-optional-copy="returnLabel"></p><h2 data-copy="returnHeadline"></h2><ul data-return-list></ul><div data-optional-copy="returnLine"></div></div>
                  <figure><img src="../../case-study-browsing/media/ready-for-decision-loop-r01-20s-720p-web-sealed-poster.webp" alt="Illustrative ready-for-decision machinery" /><div></div></figure>
                </article>
              </section>
            </article>
            <article class="device-frame device-mobile" aria-label="Mobile leadership-dividend preview">
              <section class="dividend-frame" data-mode-view="practice">
                <article class="dividend-panel practice-panel" data-panel="practice">
                  <figure><img data-practice-image alt="Illustrative decision machinery" /><div></div></figure>
                  <header data-focus-region="intro"><p data-optional-copy="practiceLabel"></p><h2 data-copy="practiceHeadline"></h2></header>
                  <div class="practice-copy" data-focus-region="story"><span data-practice-count></span><h3 data-practice-title></h3><p data-practice-copy></p></div>
                  <nav class="practice-controls" data-focus-region="controls" aria-label="Practice stages"><button type="button" data-practice="0">Notice</button><button type="button" data-practice="1">Connect</button><button type="button" data-practice="2">Prepare</button></nav>
                </article>
                <article class="dividend-panel benefits-panel" data-panel="benefits">
                  <figure><img src="../../case-study-browsing/media/evidence-connects-loop-r01-20s-720p-web-sealed-poster.webp" alt="Illustrative connecting machinery" /><div></div></figure>
                  <div class="benefit-copy" data-focus-region="benefit"><p data-optional-copy="benefitLabel"></p><span data-benefit-count></span><h2 data-benefit-title></h2><div data-benefit-copy></div></div>
                  <nav class="benefit-controls" data-focus-region="controls" aria-label="AI Brain benefits"><button type="button" data-benefit-prev aria-label="Previous benefit">←</button><i></i><button type="button" data-benefit-next aria-label="Next benefit">→</button></nav>
                </article>
                <article class="dividend-panel return-panel" data-panel="return">
                  <div class="return-copy" data-focus-region="return"><p data-optional-copy="returnLabel"></p><h2 data-copy="returnHeadline"></h2><ul data-return-list></ul><div data-optional-copy="returnLine"></div></div>
                  <figure><img src="../../case-study-browsing/media/ready-for-decision-loop-r01-20s-720p-web-sealed-poster.webp" alt="Illustrative ready-for-decision machinery" /><div></div></figure>
                </article>
              </section>
            </article>
          </div>
        </div>
        <aside class="decision-pane">
          <nav class="group-nav" aria-label="Decision sections"></nav>
          <div class="decision-progress"><span data-progress-count></span><div><i data-progress-bar></i></div></div>
          <section class="decision-card" aria-live="polite"><p class="decision-group" data-decision-group></p><h2 data-decision-title></h2><p class="decision-context" data-decision-context></p><fieldset><legend class="sr-only" data-decision-title-copy></legend><div class="decision-options" data-decision-options></div></fieldset></section>
          <footer class="decision-actions"><button type="button" class="secondary" data-prev>Previous</button><button type="button" class="primary" data-next>Next decision <span>→</span></button></footer>
        </aside>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
