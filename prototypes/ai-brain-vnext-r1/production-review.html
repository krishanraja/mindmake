<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Brain production route, paired review</title>
    <style>
      *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071512;color:#f2eadb;font-family:Arial,sans-serif}body{padding:18px}
      header{display:flex;min-height:54px;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px;border-bottom:1px solid rgba(132,228,183,.22)}
      h1{margin:0;font-size:18px;letter-spacing:.035em}p{margin:5px 0 0;color:rgba(242,234,219,.58);font-size:12px}a{color:#84e4b7;text-underline-offset:3px}
      .board{display:grid;grid-template-columns:minmax(0,806px) 254px;gap:18px;justify-content:center;align-items:start}figure{min-width:0;margin:0}figcaption{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;color:rgba(242,234,219,.7);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
      .frame{position:relative;overflow:hidden;border:1px solid rgba(242,234,219,.22);background:#0a100d;box-shadow:0 18px 50px rgba(0,0,0,.25)}
      .desktop{width:806px;height:504px}.desktop iframe{width:1440px;height:900px;transform:scale(.56);transform-origin:0 0}
      .mobile{width:254px;height:549px}.mobile iframe{width:390px;height:844px;transform:scale(.65);transform-origin:0 0}
      iframe{border:0;background:#071512}small{display:block;margin-top:10px;color:rgba(242,234,219,.5);font-size:10px;line-height:1.4}
      @media(max-width:1120px){.board{grid-template-columns:1fr}.desktop{width:min(806px,100%)}.mobile{width:254px}}
    </style>
  </head>
  <body>
    <header><div><h1>AI Brain production route</h1><p>Paired desktop and mobile acceptance view</p></div><a href="/ai-brain" target="_blank">Open responsive route</a></header>
    <main class="board">
      <figure><figcaption><span>Desktop · 1440 × 900</span><a href="/ai-brain" target="_blank">Open</a></figcaption><div class="frame desktop"><iframe src="/ai-brain" title="Desktop AI Brain production route"></iframe></div><small>Scroll inside the frame. The real brief opens as a production drawer.</small></figure>
      <figure><figcaption><span>Mobile · 390 × 844</span><a href="/ai-brain" target="_blank">Open</a></figcaption><div class="frame mobile"><iframe src="/ai-brain" title="Mobile AI Brain production route"></iframe></div><small>Mobile is recomposed around a full-width decision sheet.</small></figure>
    </main>
  </body>
</html>
