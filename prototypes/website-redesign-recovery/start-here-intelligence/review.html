<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Start here intelligence · paired review</title>
  <style>
    :root{--paper:#eee3cf;--mint:#83e4bd;--line:rgba(238,227,207,.22)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030b08;color:var(--paper);font-family:Arial,sans-serif}
    body{padding:32px}.review-head{max-width:1500px;margin:0 auto 20px;display:flex;align-items:end;justify-content:space-between;gap:20px}.review-head p{margin:0;color:var(--mint);font:11px monospace;letter-spacing:.14em;text-transform:uppercase}.review-head h1{margin:8px 0 0;font:400 32px Georgia,serif}.review-head span{color:rgba(238,227,207,.58);font-size:12px}
    .pair{max-width:1500px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:20px;align-items:start}.frame{border:1px solid var(--line);background:#0a1712;box-shadow:0 18px 70px rgba(0,0,0,.45)}.label{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;border-bottom:1px solid var(--line);font:10px monospace;letter-spacing:.1em;text-transform:uppercase;color:rgba(238,227,207,.62)}.label b{color:var(--mint);font-weight:400}.desktop-window{height:675px;overflow:hidden}.desktop-window iframe{width:1440px;height:900px;border:0;transform:scale(.75);transform-origin:0 0}.mobile-window{height:844px}.mobile-window iframe{width:390px;height:844px;border:0;display:block}
    @media(max-width:1000px){body{padding:16px}.review-head{align-items:start;flex-direction:column}.pair{grid-template-columns:1fr}.desktop-window{height:56.25vw;max-height:720px}.desktop-window iframe{width:1440px;height:900px;transform:scale(calc((100vw - 34px)/1440))}.mobile-window{width:390px;max-width:100%;margin:auto;overflow:hidden}}
  </style>
</head>
<body>
  <header class="review-head"><div><p>START HERE / LOCKED ADDITIVE CANDIDATE</p><h1>One resolved brief. Desktop and mobile.</h1></div><span>Existing journey preserved · film + state + recommendation added at resolution</span></header>
  <main class="pair">
    <section class="frame"><div class="label"><b>Desktop</b><span>1440 × 900</span></div><div class="desktop-window"><iframe src="./index.html" title="Desktop Start here candidate"></iframe></div></section>
    <section class="frame"><div class="label"><b>Mobile</b><span>390 × 844</span></div><div class="mobile-window"><iframe src="./index.html" title="Mobile Start here candidate"></iframe></div></section>
  </main>
</body>
</html>
