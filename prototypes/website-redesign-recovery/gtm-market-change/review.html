<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTM-LINKAGE-S3 / paired review</title>
    <style>
      @font-face {
        font-family: "Archivo";
        src: url("../../../node_modules/@fontsource-variable/archivo/files/archivo-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; }
      body {
        padding: 28px 30px 30px;
        color: #eadfca;
        font-family: "Archivo", sans-serif;
        background:
          radial-gradient(circle at 54% 4%, rgba(188, 242, 208, 0.09), transparent 34rem),
          #040a08;
      }
      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        height: 52px;
        padding-bottom: 14px;
        border-bottom: 1px solid rgba(210, 236, 218, 0.16);
      }
      h1 {
        margin: 0;
        font-size: 12px;
        font-weight: 640;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }
      header p {
        margin: 0;
        color: #bb9250;
        font-size: 9px;
        font-weight: 620;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .review-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 342px;
        gap: 18px;
        height: calc(100vh - 82px);
        padding-top: 18px;
      }
      figure {
        min-width: 0;
        margin: 0;
      }
      figcaption {
        display: flex;
        justify-content: space-between;
        height: 24px;
        color: rgba(234, 223, 202, 0.46);
        font-size: 8px;
        font-weight: 620;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }
      .viewport {
        position: relative;
        height: calc(100% - 24px);
        overflow: hidden;
        background: #07110e;
        border: 1px solid rgba(210, 236, 218, 0.2);
        box-shadow: 0 24px 58px rgba(0, 0, 0, 0.48);
      }
      iframe {
        position: absolute;
        top: 0;
        left: 0;
        border: 0;
        transform-origin: 0 0;
      }
      .desktop iframe {
        width: 1440px;
        height: 2400px;
        transform: scale(0.61);
      }
      .mobile .viewport {
        width: 258px;
        margin-inline: auto;
        border-radius: 22px;
        outline: 6px solid #111b17;
      }
      .mobile iframe {
        width: 390px;
        height: 2250px;
        transform: scale(0.65);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>GTM-LINKAGE-S3 / Consequence Linkage</h1>
      <p>Unapproved material concept / cold review</p>
    </header>
    <main class="review-grid">
      <figure class="desktop">
        <figcaption><span>Desktop sequence</span><span>1440 wide</span></figcaption>
        <div class="viewport">
          <iframe src="./index.html?render=final" title="Desktop GTM consequence linkage"></iframe>
        </div>
      </figure>
      <figure class="mobile">
        <figcaption><span>Mobile sequence</span><span>390 wide</span></figcaption>
        <div class="viewport">
          <iframe src="./index.html?render=final" title="Mobile GTM consequence linkage"></iframe>
        </div>
      </figure>
    </main>
  </body>
</html>
