name: Release WebKit diagnostic

on:
  push:
    branches: [codex/award-judging-panel]
    paths:
      - .github/workflows/release-webkit-diagnostic.yml
      - scripts/qa/release-webkit-diagnostic.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Probe current browser runner without changing built site or lockfile
        run: npm install --prefix "$RUNNER_TEMP/webkit-probe" --no-save --package-lock=false playwright@1.63.0
      - run: node "$RUNNER_TEMP/webkit-probe/node_modules/playwright/cli.js" install --with-deps webkit
      - name: Compare native and intercepted local transport
        run: node scripts/qa/release-webkit-diagnostic.mjs
        env:
          QA_DIAG_RUNNER_ROOT: ${{ runner.temp }}/webkit-probe
      - name: Preserve both outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-transport-diagnostic
          path: artifacts/homepage-release/webkit-diagnostic*
