<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06251f">
  <title>Mindmake Direction Lock</title>
  <link rel="icon" href="../public/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0d1929;
      --ink-soft: #142238;
      --forest: #06251f;
      --forest-deep: #031914;
      --paper: #f4f0e8;
      --paper-bright: #fffdf7;
      --mint: #6ee1c0;
      --mint-bright: #8af0d2;
      --mint-deep: #0b756c;
      --rust: #b96743;
      --rust-bright: #d48259;
      --line-dark: rgba(244, 240, 232, 0.18);
      --line-light: rgba(13, 25, 41, 0.18);
      --shadow: 0 28px 90px rgba(0, 0, 0, 0.22);
      --display: "Source Serif 4", Georgia, serif;
      --body: "Source Sans 3", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 280px;
      background: var(--forest-deep);
      color: var(--paper);
      font-family: var(--body);
      font-size: 18px;
      line-height: 1.45;
      text-rendering: optimizeLegibility;
    }

    button, textarea { font: inherit; }
    button { color: inherit; }
    button, [role="button"] { touch-action: manipulation; }

    button:focus-visible,
    textarea:focus-visible,
    input:focus-visible + .choice-copy {
      outline: 3px solid var(--rust-bright);
      outline-offset: 4px;
    }

    .app {
      min-height: 100svh;
      background:
        linear-gradient(90deg, rgba(110, 225, 192, 0.035) 1px, transparent 1px) 0 0 / 88px 88px,
        linear-gradient(rgba(110, 225, 192, 0.035) 1px, transparent 1px) 0 0 / 88px 88px,
        var(--forest-deep);
    }

    .topbar {
      min-height: 84px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 18px clamp(20px, 4vw, 64px);
      border-bottom: 1px solid var(--line-light);
      background: rgba(244, 240, 232, 0.96);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-icon { width: 34px; height: 34px; flex: 0 0 auto; }
    .brand-wordmark { width: clamp(150px, 17vw, 210px); height: auto; display: block; }

    .topbar-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 18px;
      color: rgba(13, 25, 41, 0.72);
      font-size: 0.82rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .save-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .save-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 0 5px rgba(110, 225, 192, 0.08);
    }

    .quiet-button {
      min-height: 44px;
      border: 0;
      border-bottom: 1px solid currentColor;
      padding: 8px 0 5px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
    }

    .shell {
      width: min(1540px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(220px, 280px) minmax(0, 1fr);
      gap: clamp(24px, 4vw, 70px);
      padding: clamp(26px, 4vw, 64px);
      align-items: stretch;
    }

    .decision-rail {
      min-width: 0;
      padding: 22px 4px 16px;
      display: flex;
      flex-direction: column;
    }

    .eyebrow {
      margin: 0 0 22px;
      color: var(--mint);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.17em;
      text-transform: uppercase;
    }

    .rail-title {
      margin: 0;
      max-width: 10ch;
      font-family: var(--display);
      font-size: clamp(2.2rem, 4vw, 4.7rem);
      font-weight: 500;
      line-height: 0.96;
      letter-spacing: -0.04em;
    }

    .rail-copy {
      max-width: 26ch;
      margin: 24px 0 34px;
      color: rgba(244, 240, 232, 0.7);
      font-size: 0.98rem;
    }

    .thread {
      list-style: none;
      margin: auto 0 0;
      padding: 10px 0 0;
      position: relative;
    }

    .thread::before {
      content: "";
      position: absolute;
      left: 8px;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--line-dark);
    }

    .thread-item {
      min-height: 47px;
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
      position: relative;
      color: rgba(244, 240, 232, 0.42);
      font-size: 0.78rem;
      letter-spacing: 0.04em;
    }

    .thread-node {
      width: 17px;
      height: 17px;
      border: 1px solid rgba(244, 240, 232, 0.35);
      border-radius: 50%;
      background: var(--forest-deep);
      position: relative;
      z-index: 1;
    }

    .thread-item.is-current { color: var(--paper); }
    .thread-item.is-current .thread-node { border-color: var(--rust-bright); box-shadow: inset 0 0 0 4px var(--forest-deep); background: var(--rust-bright); }
    .thread-item.is-fixed { color: rgba(244, 240, 232, 0.8); }
    .thread-item.is-fixed .thread-node { border-color: var(--mint); background: var(--mint); }
    .thread-answer { display: block; color: var(--mint); margin-top: 2px; }

    .surface {
      min-width: 0;
      min-height: min(760px, calc(100svh - 150px));
      background: var(--paper);
      color: var(--ink);
      box-shadow: var(--shadow);
      border-top: 7px solid var(--mint);
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .surface::before,
    .surface::after {
      content: "";
      position: absolute;
      width: 34px;
      height: 34px;
      pointer-events: none;
      opacity: 0.45;
    }

    .surface::before { top: 22px; left: 22px; border-top: 1px solid var(--ink); border-left: 1px solid var(--ink); }
    .surface::after { bottom: 22px; right: 22px; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }

    .surface-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: clamp(28px, 4vw, 54px) clamp(26px, 5vw, 72px) 0;
    }

    .step-count {
      color: var(--mint-deep);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .progress-track {
      width: min(260px, 38%);
      height: 3px;
      background: rgba(13, 25, 41, 0.12);
      overflow: hidden;
    }

    .progress-fill { height: 100%; background: var(--mint-deep); transform-origin: left center; transition: width 260ms ease; }

    .surface-body {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(180px, 235px);
      gap: clamp(30px, 5vw, 76px);
      align-items: start;
      padding: clamp(42px, 6vw, 84px) clamp(26px, 5vw, 72px) 42px;
    }

    .surface-body.no-aside { grid-template-columns: 1fr; }

    .question-column { min-width: 0; }
    .question-kicker { margin: 0 0 14px; color: var(--rust); font-size: 0.76rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }

    h1, h2 { font-family: var(--display); font-weight: 500; letter-spacing: -0.04em; }

    .question-title {
      max-width: 18ch;
      margin: 0;
      font-size: clamp(2.6rem, 5.8vw, 6.4rem);
      line-height: 0.98;
      text-wrap: balance;
    }

    .question-help {
      max-width: 60ch;
      margin: 26px 0 0;
      color: rgba(13, 25, 41, 0.7);
      font-size: 1rem;
    }

    .choices {
      border: 0;
      padding: 0;
      margin: clamp(38px, 5vw, 64px) 0 0;
      min-width: 0;
    }

    .choices legend {
      width: 100%;
      margin: 0 0 14px;
      color: var(--mint-deep);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .choice {
      display: block;
      position: relative;
      border-top: 1px solid var(--line-light);
      cursor: pointer;
    }

    .choice:last-child { border-bottom: 1px solid var(--line-light); }
    .choice input { position: absolute; opacity: 0; pointer-events: none; }

    .choice-copy {
      min-height: 76px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 22px;
      align-items: center;
      padding: 18px 4px;
      transition: color 180ms ease, padding 180ms ease, opacity 180ms ease, background 180ms ease;
    }

    .choice-statement {
      max-width: 52ch;
      font-family: var(--display);
      font-size: clamp(1.22rem, 2.1vw, 1.85rem);
      line-height: 1.18;
    }

    .choice-marker {
      width: 24px;
      height: 24px;
      border: 1px solid rgba(13, 25, 41, 0.42);
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .choice-marker::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--mint-deep); transform: scale(0); transition: transform 160ms ease; }
    .choice input:checked + .choice-copy { padding-left: 18px; background: rgba(110, 225, 192, 0.16); }
    .choice input:checked + .choice-copy .choice-marker { border-color: var(--mint-deep); }
    .choice input:checked + .choice-copy .choice-marker::after { transform: scale(1); }
    .choices.has-selection .choice:not(:has(input:checked)) .choice-copy { opacity: 0.48; }
    .choice:hover .choice-copy { background: rgba(110, 225, 192, 0.1); opacity: 1 !important; }

    .rank-list { list-style: none; padding: 0; margin: clamp(38px, 5vw, 64px) 0 0; counter-reset: rank; }
    .rank-row { counter-increment: rank; display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; align-items: center; gap: 14px; min-height: 78px; border-top: 1px solid var(--line-light); background: transparent; transition: background 180ms ease, transform 180ms ease; }
    .rank-row:last-child { border-bottom: 1px solid var(--line-light); }
    .rank-row::before { content: counter(rank, decimal-leading-zero); color: var(--mint-deep); font-weight: 700; font-size: 0.78rem; letter-spacing: 0.08em; }
    .rank-row.is-moved { background: rgba(110, 225, 192, 0.11); }
    .rank-statement { font-family: var(--display); font-size: clamp(1.08rem, 1.8vw, 1.52rem); line-height: 1.2; }
    .rank-controls { display: flex; gap: 6px; }
    .rank-button { width: 44px; min-height: 44px; border: 1px solid var(--line-light); background: transparent; color: var(--ink); cursor: pointer; }
    .rank-button:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
    .rank-button:disabled { opacity: 0.25; cursor: not-allowed; }
    .ranking-note { margin: 18px 0 0; color: rgba(13, 25, 41, 0.66); font-size: 0.88rem; }

    .aside {
      min-width: 0;
      align-self: stretch;
      border-left: 1px solid var(--line-light);
      padding-left: clamp(22px, 3vw, 36px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 36px;
    }

    .aside-label { margin: 0 0 12px; color: var(--mint-deep); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
    .aside-copy { margin: 0; color: rgba(13, 25, 41, 0.64); font-size: 0.9rem; }
    .current-choice { margin: 16px 0 0; font-family: var(--display); font-size: 1.3rem; line-height: 1.16; color: var(--ink); }

    .note-toggle { min-height: 44px; border: 0; border-bottom: 1px solid currentColor; padding: 8px 0 5px; background: transparent; color: var(--rust); cursor: pointer; text-align: left; }
    .note-wrap { margin-top: 16px; }
    .note-wrap[hidden] { display: none; }
    .note-label { display: block; margin: 0 0 8px; color: var(--ink); font-size: 0.8rem; font-weight: 700; }
    .note-field { width: 100%; min-height: 150px; resize: vertical; border: 1px solid var(--line-light); border-radius: 0; padding: 13px; background: var(--paper-bright); color: var(--ink); }
    .note-hint { margin: 7px 0 0; color: rgba(13, 25, 41, 0.55); font-size: 0.76rem; }

    .surface-actions {
      min-height: 96px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px clamp(26px, 5vw, 72px) 26px;
      border-top: 1px solid var(--line-light);
      background: rgba(255, 253, 247, 0.72);
    }

    .action-group { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-left: auto; }
    .button { min-height: 50px; border: 1px solid var(--ink); padding: 12px 20px; background: transparent; color: var(--ink); font-weight: 700; cursor: pointer; }
    .button:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
    .button.primary { background: var(--mint); color: var(--ink); }
    .button.primary:hover:not(:disabled) { background: var(--mint-bright); color: var(--ink); }
    .button:disabled { opacity: 0.34; cursor: not-allowed; }
    .button.text { border-color: transparent; padding-left: 4px; padding-right: 4px; }
    .confirm-state { min-height: 24px; color: var(--mint-deep); font-size: 0.82rem; font-weight: 700; }
    .error-text { margin: 10px 0 0; color: #8b321f; font-weight: 700; font-size: 0.86rem; }

    .intro-copy { max-width: 62ch; margin: 28px 0 0; color: rgba(13, 25, 41, 0.68); font-size: 1.08rem; }
    .locked-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; margin-top: clamp(36px, 5vw, 62px); background: var(--line-light); border: 1px solid var(--line-light); }
    .locked-item { min-height: 112px; padding: 20px; background: var(--paper); }
    .locked-number { display: block; margin-bottom: 12px; color: var(--mint-deep); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; }
    .locked-text { margin: 0; font-family: var(--display); font-size: 1.14rem; line-height: 1.2; }

    .review { max-width: 900px; }
    .review-title { max-width: 12ch; margin: 0; font-size: clamp(3rem, 6.5vw, 7rem); line-height: 0.94; }
    .review-intro { max-width: 58ch; margin: 28px 0 0; color: rgba(13, 25, 41, 0.68); }
    .review-section { margin-top: 54px; }
    .review-section h2 { margin: 0 0 20px; font-size: clamp(1.8rem, 3.2vw, 2.7rem); }
    .review-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line-light); }
    .review-row { display: grid; grid-template-columns: minmax(160px, 0.42fr) minmax(0, 1fr) auto; gap: 24px; padding: 20px 0; border-bottom: 1px solid var(--line-light); }
    .review-question { margin: 0; color: rgba(13, 25, 41, 0.62); font-size: 0.88rem; }
    .review-answer { margin: 0; font-family: var(--display); font-size: 1.18rem; line-height: 1.25; }
    .review-note { margin: 8px 0 0; color: rgba(13, 25, 41, 0.64); font-size: 0.86rem; white-space: pre-wrap; }
    .locked-review .review-row { grid-template-columns: minmax(0, 1fr); }
    .locked-review .review-answer { max-width: 68ch; }
    .edit-button { min-height: 44px; border: 0; border-bottom: 1px solid currentColor; padding: 8px 0 4px; background: transparent; color: var(--mint-deep); cursor: pointer; align-self: start; }
    .open-callout { padding: 18px 20px; border-left: 4px solid var(--rust); background: rgba(185, 103, 67, 0.08); color: rgba(13, 25, 41, 0.76); }

    .toast { position: fixed; left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); transform: translate(-50%, 20px); max-width: min(520px, calc(100% - 32px)); padding: 12px 18px; background: var(--ink); color: var(--paper); box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity 180ms ease, transform 180ms ease; z-index: 50; }
    .toast.is-visible { opacity: 1; transform: translate(-50%, 0); }
    .sr-only { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important; }

    @media (max-width: 980px) {
      .shell { grid-template-columns: 1fr; padding: 24px; gap: 20px; }
      .decision-rail { padding: 10px 0 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: end; }
      .rail-title { max-width: 16ch; font-size: clamp(2.2rem, 8vw, 4rem); }
      .rail-copy { display: none; }
      .thread { display: flex; gap: 5px; margin: 0; padding: 0; }
      .thread::before { display: none; }
      .thread-item { min-height: 0; display: block; }
      .thread-node { width: 14px; height: 14px; }
      .thread-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); }
      .surface { min-height: 690px; }
      .surface-body { grid-template-columns: minmax(0, 1fr) minmax(170px, 210px); gap: 28px; }
    }

    @media (max-width: 720px) {
      body { font-size: 17px; }
      .app { padding-bottom: calc(88px + env(safe-area-inset-bottom)); }
      .topbar { min-height: 68px; padding: 13px 16px; }
      .brand-icon { width: 29px; height: 29px; }
      .brand-wordmark { width: 142px; }
      .topbar-meta > span:first-child, .quiet-button { display: none; }
      .save-status { font-size: 0.7rem; }
      .shell { padding: 18px 14px; gap: 16px; }
      .decision-rail { grid-template-columns: 1fr; gap: 14px; align-items: start; }
      .rail-title { max-width: 14ch; font-size: 2.7rem; }
      .thread { width: 100%; }
      .thread-item { flex: 1 1 0; }
      .thread-node { width: 100%; height: 4px; border: 0; border-radius: 0; background: rgba(244, 240, 232, 0.18); }
      .thread-item.is-current .thread-node { box-shadow: none; background: var(--rust-bright); }
      .thread-item.is-fixed .thread-node { background: var(--mint); }
      .surface { min-height: 0; overflow: visible; border-top-width: 5px; }
      .surface::before, .surface::after { display: none; }
      .surface-head { padding: 24px 20px 0; }
      .progress-track { width: 42%; }
      .surface-body, .surface-body.no-aside { grid-template-columns: 1fr; gap: 34px; padding: 38px 20px 32px; }
      .question-title { max-width: 15ch; font-size: clamp(2.55rem, 13vw, 4.2rem); }
      .question-help { margin-top: 20px; }
      .choices { margin-top: 34px; }
      .choice-copy { min-height: 70px; gap: 14px; padding: 16px 2px; }
      .choice input:checked + .choice-copy { padding-left: 12px; }
      .rank-list { margin-top: 34px; }
      .rank-row { grid-template-columns: 31px minmax(0, 1fr) auto; gap: 9px; padding: 9px 0; }
      .rank-controls { flex-direction: column; }
      .aside { border-left: 0; border-top: 1px solid var(--line-light); padding: 26px 0 0; gap: 24px; }
      .note-field { min-height: 120px; }
      .is-question .surface-actions { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; min-height: 78px; padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); background: rgba(255, 253, 247, 0.97); box-shadow: 0 -14px 35px rgba(3, 25, 20, 0.14); }
      .confirm-state { display: none; }
      .action-group { width: 100%; }
      .action-group .button { flex: 1 1 auto; }
      .action-group:not(.is-confirmed) #next-button { display: none; }
      .action-group.is-confirmed #confirm-button { display: none; }
      .button { min-height: 52px; padding: 12px 15px; }
      .locked-grid { grid-template-columns: 1fr; }
      .review-row { grid-template-columns: 1fr auto; gap: 12px; }
      .review-question { grid-column: 1 / -1; }
      .review-answer { grid-column: 1; }
      .edit-button { grid-column: 2; grid-row: 2; }
    }

    @media (max-width: 390px) {
      .brand-wordmark { width: 122px; }
      .rail-title { font-size: 2.25rem; }
      .surface-body, .surface-body.no-aside { padding-left: 17px; padding-right: 17px; }
      .surface-head { padding-left: 17px; padding-right: 17px; }
      .question-title { font-size: 2.45rem; }
      .rank-row { grid-template-columns: 26px minmax(0, 1fr) auto; }
      .rank-button { width: 42px; min-height: 44px; }
      .action-group { gap: 8px; }
      .button { font-size: 0.9rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand" aria-label="Mindmake">
        <img class="brand-icon" src="../public/favicon.svg" alt="">
        <img class="brand-wordmark" src="./assets/mindmake-wordmark.png" alt="Mindmake">
      </div>
      <div class="topbar-meta">
        <span>Direction lock</span>
        <span class="save-status" id="save-status"><span class="save-dot" aria-hidden="true"></span><span>Saved on this device</span></span>
        <button class="quiet-button" type="button" id="download-progress">Save a copy</button>
      </div>
    </header>

    <main class="shell" id="main"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sr-only" id="live-region" aria-live="polite"></div>

  <script>
    (() => {
      'use strict';

      const QUIZ_ID = 'mindmake-design-direction';
      const QUIZ_VERSION = 1;
      const STORAGE_KEY = `${QUIZ_ID}:v${QUIZ_VERSION}`;

      const lockedDecisions = [
        'The current judgement-thread direction is the floor. This is not a new visual reset.',
        'AI Brain is personal. It helps a leader decide, lead and use their time with more confidence.',

      const freshState = () => ({
        quizVersion: QUIZ_VERSION,
        screen: 'intro',
        responses: Object.fromEntries(questions.map(question => [question.id, {
          draft: question.type === 'rank' ? question.options.map(option => option.id) : null,
          confirmed: null,
          confirmedAt: null,
          note: '',
          rankTouched: false,
          keepOrder: false,
          noteOpen: false
        }]))
      });

      let state = loadState();
      let saveTimer = null;
      let toastTimer = null;

      const main = document.getElementById('main');
      const saveStatus = document.getElementById('save-status');
      const liveRegion = document.getElementById('live-region');
      const toast = document.getElementById('toast');
      const downloadProgress = document.getElementById('download-progress');

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return freshState();
          const parsed = JSON.parse(raw);
          if (parsed.quizVersion !== QUIZ_VERSION || !parsed.responses) return freshState();
          const clean = freshState();
          clean.screen = parsed.screen ?? 'intro';
          questions.forEach(question => {
            if (!parsed.responses[question.id]) return;
            clean.responses[question.id] = { ...clean.responses[question.id], ...parsed.responses[question.id] };
          });
          return clean;
        } catch (error) {
          return freshState();
        }
      }

      function queueSave() {
        setSaveStatus('Saving…', 'saving');
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            setSaveStatus('Saved on this device', 'saved');
          } catch (error) {
            setSaveStatus('Could not save here', 'error');
          }
        }, 180);
      }

      function setSaveStatus(message, mode) {
        saveStatus.innerHTML = `<span class="save-dot" aria-hidden="true"></span><span>${escapeHTML(message)}</span>`;
        const dot = saveStatus.querySelector('.save-dot');
        if (mode === 'error') dot.style.background = 'var(--rust-bright)';
        if (mode === 'saving') dot.style.opacity = '0.45';
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('is-visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('is-visible'), 2600);
      }

      function announce(message) {
        liveRegion.textContent = '';
        requestAnimationFrame(() => { liveRegion.textContent = message; });
      }

      function currentIndex() {
        return typeof state.screen === 'number' ? state.screen : -1;
      }

      function responseFor(question) { return state.responses[question.id]; }

      function optionFor(question, id) { return question.options.find(option => option.id === id); }

      function answerLabel(question, answer) {
        if (answer == null) return '';
        if (question.type === 'rank') {
          return answer.map((id, index) => `${index + 1}. ${optionFor(question, id)?.label ?? id}`).join(' | ');
        }
        return optionFor(question, answer)?.label ?? answer;
      }

      function railLabel(question, answer) {
        if (answer == null) return '';
        if (question.type === 'rank') return `1. ${optionFor(question, answer[0])?.label ?? ''}`;
        const option = optionFor(question, answer);
        return option?.rail ?? option?.label ?? '';
      }

      function hasValidDraft(question, response) {
        if (question.type === 'rank') return Array.isArray(response.draft) && response.draft.length === question.options.length && (response.rankTouched || response.keepOrder);
        return Boolean(response.draft);
      }

      function isDraftConfirmed(question, response) {
        if (response.confirmed == null) return false;
        return JSON.stringify(response.draft) === JSON.stringify(response.confirmed);
      }

      function render() {
        if (state.screen === 'intro') renderIntro();
        else if (state.screen === 'review') renderReview();
        else renderQuestion(currentIndex());
        queueSave();
      }

      function railHTML(index = -1) {
        const items = questions.map((question, questionIndex) => {
          const response = responseFor(question);
          const fixed = response.confirmed != null;
          const current = questionIndex === index;
          return `<li class="thread-item${fixed ? ' is-fixed' : ''}${current ? ' is-current' : ''}">
            <span class="thread-node" aria-hidden="true"></span>
            <span class="thread-label">${escapeHTML(question.short)}${fixed ? `<span class="thread-answer">${escapeHTML(railLabel(question, response.confirmed))}</span>` : ''}</span>
          </li>`;
        }).join('');

        return `<aside class="decision-rail" aria-label="Decision progress">
          <div>
            <p class="eyebrow">The decision edit</p>
            <h1 class="rail-title">Keep the best. Decide the rest.</h1>
            <p class="rail-copy">The direction already agreed stays fixed. Only the choices that still change the design appear here.</p>
          </div>
          <ol class="thread">${items}</ol>
        </aside>`;
      }

      function renderIntro() {
        main.innerHTML = `${railHTML()}
          <section class="surface is-intro" aria-labelledby="intro-title">
            <div class="surface-head">
              <span class="step-count">Before we begin</span>
              <span class="progress-track" aria-hidden="true"><span class="progress-fill" style="width:0%"></span></span>
            </div>
            <div class="surface-body no-aside">
              <div class="question-column">
                <p class="question-kicker">Not another reset</p>
                <h2 class="question-title" id="intro-title">Most of the direction is already fixed.</h2>
                <p class="intro-copy">This is a short edit of the choices that still matter. One question appears at a time. Your answers stay on this device until you copy or download the finished brief.</p>
                <div class="locked-grid" aria-label="Decisions already locked">
                  ${lockedDecisions.map((decision, index) => `<div class="locked-item"><span class="locked-number">LOCKED ${String(index + 1).padStart(2, '0')}</span><p class="locked-text">${escapeHTML(decision)}</p></div>`).join('')}
                </div>
              </div>
            </div>
            <div class="surface-actions">
              <span class="confirm-state">Seven useful choices. About five minutes.</span>
              <div class="action-group"><button class="button primary" id="start-button" type="button">Start with the opening →</button></div>
            </div>
          </section>`;
        document.getElementById('start-button').addEventListener('click', () => {
          state.screen = 0;
          render();
          focusSurfaceHeading();
        });
      }

      function renderQuestion(index) {
        const question = questions[index];
        const response = responseFor(question);
        const progress = Math.round(((index + 1) / questions.length) * 100);
        const confirmed = isDraftConfirmed(question, response);
        const canConfirm = hasValidDraft(question, response) && !confirmed;
        const current = question.type === 'single' ? optionFor(question, response.draft) : null;

        const choicesHTML = question.type === 'single' ? singleChoicesHTML(question, response) : rankingHTML(question, response);
        const keepOrder = question.type === 'rank' && !response.rankTouched && !response.keepOrder
          ? `<button class="note-toggle" id="keep-order" type="button">Keep this starting order</button>` : '';

        main.innerHTML = `${railHTML(index)}
          <section class="surface is-question" aria-labelledby="question-title">
            <div class="surface-head">
              <span class="step-count">${String(index + 1).padStart(2, '0')} / ${String(questions.length).padStart(2, '0')}</span>
              <span class="progress-track" aria-label="${progress}% complete"><span class="progress-fill" style="width:${progress}%"></span></span>
            </div>
            <div class="surface-body">
              <div class="question-column">
                <p class="question-kicker">${escapeHTML(question.kicker)}</p>
                <h2 class="question-title" id="question-title" tabindex="-1">${escapeHTML(question.title)}</h2>
                <p class="question-help">${escapeHTML(question.help)}</p>
                ${choicesHTML}
                <p class="error-text" id="question-error" hidden></p>
              </div>
              <aside class="aside" aria-label="Question context and optional note">
                <div>
                  <p class="aside-label">Why this matters</p>
                  <p class="aside-copy">${escapeHTML(question.aside)}</p>
                  ${current ? `<p class="current-choice">${escapeHTML(current.rail ?? current.label)}</p>` : ''}
                </div>
                <div>
                  ${keepOrder}
                  <button class="note-toggle" id="note-toggle" type="button" aria-expanded="${response.noteOpen}" aria-controls="note-wrap">${response.noteOpen ? 'Hide note' : response.note ? 'Edit your note' : 'Add why, if useful'}</button>
                  <div class="note-wrap" id="note-wrap" ${response.noteOpen ? '' : 'hidden'}>
                    <label class="note-label" for="note-field">Optional note</label>
                    <textarea class="note-field" id="note-field" maxlength="2000" placeholder="What should the final design protect or avoid?">${escapeHTML(response.note)}</textarea>
                    <p class="note-hint">This will appear in the handoff exactly as written.</p>
                  </div>
                </div>
              </aside>
            </div>
            <div class="surface-actions">
              <span class="confirm-state" id="confirm-state">${confirmed ? 'Answer confirmed.' : response.confirmed != null ? 'This answer changed. Confirm it again.' : 'Nothing is exported until you confirm.'}</span>
              <div class="action-group${confirmed ? ' is-confirmed' : ''}">
                <button class="button text" id="back-button" type="button">← Back</button>
                <button class="button" id="confirm-button" type="button" ${canConfirm ? '' : 'disabled'}>Confirm this answer</button>
                <button class="button primary" id="next-button" type="button" ${confirmed ? '' : 'disabled'}>${index === questions.length - 1 ? 'Review the brief →' : 'Next choice →'}</button>
              </div>
            </div>
          </section>`;

        bindQuestionEvents(question, index);
      }

      function singleChoicesHTML(question, response) {
        return `<fieldset class="choices${response.draft ? ' has-selection' : ''}" aria-describedby="question-error">
          <legend>Choose one</legend>
          ${question.options.map(option => `<label class="choice">
            <input type="radio" name="${escapeAttr(question.id)}" value="${escapeAttr(option.id)}" ${response.draft === option.id ? 'checked' : ''}>
            <span class="choice-copy"><span class="choice-statement">${escapeHTML(option.label)}</span><span class="choice-marker" aria-hidden="true"></span></span>
          </label>`).join('')}
        </fieldset>`;
      }

      function rankingHTML(question, response) {
        return `<ol class="rank-list" aria-label="Ranked choices">
          ${response.draft.map((id, position) => {
            const option = optionFor(question, id);
            return `<li class="rank-row${response.rankTouched ? ' is-moved' : ''}" data-rank-id="${escapeAttr(id)}">
              <span class="rank-statement">${escapeHTML(option.label)}</span>
              <span class="rank-controls">
                <button class="rank-button" type="button" data-move="up" aria-label="Move ${escapeAttr(option.label)} up" ${position === 0 ? 'disabled' : ''}>↑</button>
                <button class="rank-button" type="button" data-move="down" aria-label="Move ${escapeAttr(option.label)} down" ${position === response.draft.length - 1 ? 'disabled' : ''}>↓</button>
              </span>
            </li>`;
          }).join('')}
        </ol>
        <p class="ranking-note">This is the starting order, not an answer. Move at least one item or choose “Keep this starting order”.</p>`;
      }

      function bindQuestionEvents(question, index) {
        const response = responseFor(question);
        const noteToggle = document.getElementById('note-toggle');
        const noteField = document.getElementById('note-field');

        if (question.type === 'single') {
          document.querySelectorAll(`input[name="${question.id}"]`).forEach(input => {
            input.addEventListener('change', event => {
              response.draft = event.target.value;
              if (response.confirmed !== response.draft) response.confirmed = null;
              renderQuestion(index);
              const selected = document.querySelector(`input[name="${question.id}"][value="${CSS.escape(event.target.value)}"]`);
              selected?.focus();
              announce(`${optionFor(question, event.target.value).label} selected. Confirm this answer when ready.`);
            });
          });
        } else {
          document.querySelectorAll('.rank-button').forEach(button => {
            button.addEventListener('click', event => {
              const row = event.currentTarget.closest('.rank-row');
              const id = row.dataset.rankId;
              const from = response.draft.indexOf(id);
              const direction = event.currentTarget.dataset.move;
              const to = direction === 'up' ? from - 1 : from + 1;
              if (to < 0 || to >= response.draft.length) return;
              const next = [...response.draft];
              [next[from], next[to]] = [next[to], next[from]];
              response.draft = next;
              response.rankTouched = true;
              response.keepOrder = false;
              response.confirmed = null;
              renderQuestion(index);
              const moved = document.querySelector(`[data-rank-id="${CSS.escape(id)}"]`);
              moved?.querySelector(`[data-move="${direction}"]`)?.focus();
              announce(`${optionFor(question, id).label} moved to position ${to + 1} of ${next.length}.`);
            });
          });
          document.getElementById('keep-order')?.addEventListener('click', () => {
            response.keepOrder = true;
            response.confirmed = null;
            renderQuestion(index);
            document.getElementById('confirm-button')?.focus();
            announce('Starting order kept. Confirm this answer when ready.');
          });
        }

        noteToggle.addEventListener('click', () => {
          response.noteOpen = !response.noteOpen;
          renderQuestion(index);
          if (response.noteOpen) document.getElementById('note-field')?.focus();
        });

        noteField?.addEventListener('input', event => {
          response.note = event.target.value;
          if (response.confirmed != null) response.confirmed = null;
          queueSave();
          const confirmButton = document.getElementById('confirm-button');
          const nextButton = document.getElementById('next-button');
          if (confirmButton) confirmButton.disabled = !hasValidDraft(question, response);
          if (nextButton) nextButton.disabled = true;
          const status = document.getElementById('confirm-state');
          if (status) status.textContent = 'Your note changed. Confirm this answer again.';
        });

        document.getElementById('back-button').addEventListener('click', () => {
          state.screen = index === 0 ? 'intro' : index - 1;
          render();
          focusSurfaceHeading();
        });

        document.getElementById('confirm-button').addEventListener('click', () => {
          if (!hasValidDraft(question, response)) {
            showQuestionError(question.type === 'rank' ? 'Move an item or keep the starting order before you confirm.' : 'Choose one answer before you confirm.');
            return;
          }
          response.confirmed = question.type === 'rank' ? [...response.draft] : response.draft;
          response.confirmedAt = new Date().toISOString();
          renderQuestion(index);
          document.getElementById('next-button')?.focus();
          announce('Answer confirmed.');
        });

        document.getElementById('next-button').addEventListener('click', () => {
          if (!isDraftConfirmed(question, response)) {
            showQuestionError('Confirm this answer before you continue.');
            return;
          }
          state.screen = index === questions.length - 1 ? 'review' : index + 1;
          render();
          focusSurfaceHeading();
        });
      }

      function showQuestionError(message) {
        const error = document.getElementById('question-error');
        if (!error) return;
        error.hidden = false;
        error.textContent = message;
        error.focus?.();
        announce(message);
      }

      function renderReview() {
        const confirmedQuestions = questions.filter(question => responseFor(question).confirmed != null);
        const unansweredQuestions = questions.filter(question => responseFor(question).confirmed == null);
        const allConfirmed = confirmedQuestions.length === questions.length;

        main.innerHTML = `${railHTML()}
          <section class="surface is-review" aria-labelledby="review-title">
            <div class="surface-head">
              <span class="step-count">Finished brief</span>
              <span class="progress-track" aria-label="${allConfirmed ? 100 : Math.round((confirmedQuestions.length / questions.length) * 100)}% complete"><span class="progress-fill" style="width:${allConfirmed ? 100 : Math.round((confirmedQuestions.length / questions.length) * 100)}%"></span></span>
            </div>
            <div class="surface-body no-aside">
              <div class="review">
                <p class="question-kicker">The decisions are now in one place</p>
                <h1 class="review-title" id="review-title" tabindex="-1">A clean brief to build from.</h1>
                <p class="review-intro">The export includes the decisions that were already locked, every question in full, each confirmed answer and your optional notes. Draft answers are never presented as decisions.</p>

                <section class="review-section" aria-labelledby="review-locked">
                  <h2 id="review-locked">Already locked</h2>
                  <ol class="review-list locked-review">
                    ${lockedDecisions.map(decision => `<li class="review-row"><p class="review-answer">${escapeHTML(decision)}</p></li>`).join('')}
                  </ol>
                </section>

                <section class="review-section" aria-labelledby="review-choices">
                  <h2 id="review-choices">Your confirmed choices</h2>
                  <ul class="review-list">
                    ${confirmedQuestions.map(question => {
                      const response = responseFor(question);
                      const answer = question.type === 'rank'
                        ? `<ol>${response.confirmed.map(id => `<li>${escapeHTML(optionFor(question, id).label)}</li>`).join('')}</ol>`
                        : escapeHTML(answerLabel(question, response.confirmed));
                      return `<li class="review-row">
                        <p class="review-question">${escapeHTML(question.title)}</p>
                        <div><div class="review-answer">${answer}</div>${response.note ? `<p class="review-note"><strong>Your note:</strong> ${escapeHTML(response.note)}</p>` : ''}</div>
                        <button class="edit-button" type="button" data-edit="${escapeAttr(question.id)}">Edit</button>
                      </li>`;
                    }).join('')}
                  </ul>
                </section>

                ${unansweredQuestions.length ? `<section class="review-section" aria-labelledby="review-open"><h2 id="review-open">Still open</h2><div class="open-callout">${unansweredQuestions.map(question => escapeHTML(question.title)).join('<br>')}</div></section>` : ''}
              </div>
            </div>
            <div class="surface-actions">
              <span class="confirm-state">${allConfirmed ? 'Seven decisions confirmed.' : `${confirmedQuestions.length} of ${questions.length} decisions confirmed.`}</span>
              <div class="action-group">
                <button class="button text" id="review-back" type="button">← Back</button>
                <button class="button" id="copy-result" type="button">Copy HTML result</button>
                <button class="button primary" id="download-result" type="button">Download HTML →</button>
              </div>
            </div>
          </section>`;

        document.querySelectorAll('[data-edit]').forEach(button => {
          button.addEventListener('click', () => {
            state.screen = questions.findIndex(question => question.id === button.dataset.edit);
            render();
            focusSurfaceHeading();
          });
        });
        document.getElementById('review-back').addEventListener('click', () => {
          state.screen = questions.length - 1;
          render();
          focusSurfaceHeading();
        });
        document.getElementById('copy-result').addEventListener('click', () => copyExport(false));
        document.getElementById('download-result').addEventListener('click', () => downloadExport(false));
      }

      function exportData(partial = false) {
        const confirmed = questions.filter(question => responseFor(question).confirmed != null);
        const unanswered = questions.filter(question => responseFor(question).confirmed == null).map(question => question.id);
        return {
          schema: 'mindmake.decision-brief',
          schema_version: 1,
          quiz: {
            id: QUIZ_ID,
            version: QUIZ_VERSION,
            title: 'Mindmake website direction lock'
          },
          export: {
            id: typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : `mindmake-${Date.now()}`,
            created_at: new Date().toISOString(),
            status: unanswered.length === 0 ? 'complete' : 'partial',
            confirmed_count: confirmed.length,
            question_count: questions.length,
            recovery_copy: partial
          },
          locked_decisions: [...lockedDecisions],
          responses: confirmed.map(question => {
            const response = responseFor(question);
            return {
              question_id: question.id,
              question: question.title,
              type: question.type,
              answer: question.type === 'rank'
                ? response.confirmed.map((id, index) => ({ rank: index + 1, option_id: id, label: optionFor(question, id).label }))
                : { option_id: response.confirmed, label: optionFor(question, response.confirmed).label },
              note: response.note || null,
              confirmed_at: response.confirmedAt
            };
          }),
          unanswered_question_ids: unanswered
        };
      }

      function buildExportHTML(partial = false) {
        const data = exportData(partial);
        const responseRows = data.responses.map(response => {
          const answerHTML = response.type === 'rank'
            ? `<ol>${response.answer.map(item => `<li>${escapeHTML(item.label)}</li>`).join('')}</ol>`
            : `<p class="answer">${escapeHTML(response.answer.label)}</p>`;
          return `<section class="decision"><p class="label">${escapeHTML(response.question)}</p>${answerHTML}${response.note ? `<p class="note"><strong>Note:</strong> ${escapeHTML(response.note)}</p>` : ''}</section>`;
        }).join('');
        const unanswered = data.unanswered_question_ids.length
          ? `<section><h2>Still open</h2><ul>${data.unanswered_question_ids.map(id => `<li>${escapeHTML(questions.find(question => question.id === id).title)}</li>`).join('')}</ul></section>` : '';
        const safeJSON = JSON.stringify(data, null, 2).replace(/</g, '\\u003c');

        return `<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mindmake website direction brief</title>
  <style>
    :root{--ink:#0d1929;--forest:#06251f;--paper:#f4f0e8;--mint:#6ee1c0;--rust:#b96743}*{box-sizing:border-box}body{margin:0;background:var(--forest);color:var(--ink);font:18px/1.5 Arial,sans-serif}.brief{width:min(980px,calc(100% - 32px));margin:32px auto;background:var(--paper);border-top:7px solid var(--mint);padding:clamp(28px,6vw,76px);box-shadow:0 24px 70px rgba(0,0,0,.22)}h1,h2,.answer,.decision ol{font-family:Georgia,serif}h1{max-width:12ch;margin:0;font-size:clamp(42px,7vw,84px);line-height:.98;letter-spacing:-.04em}h2{margin:56px 0 18px;font-size:34px}.meta{margin:18px 0 0;color:#4f5a62}.locked,.decisions{margin:0;padding:0;list-style:none;border-top:1px solid rgba(13,25,41,.2)}.locked li,.decision{padding:20px 0;border-bottom:1px solid rgba(13,25,41,.2)}.label{margin:0 0 10px;color:#52605f;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}.answer,.decision ol{margin:0;font-size:24px;line-height:1.3}.decision ol{padding-left:28px}.note{white-space:pre-wrap;padding-left:14px;border-left:3px solid var(--rust)}@media(max-width:520px){.brief{width:100%;margin:0;box-shadow:none;padding:28px 20px}.answer,.decision ol{font-size:21px}}
  </style>
</head>
<body>
  <!-- MINDMAKE DECISION BRIEF START -->
  <main class="brief">
    <p class="label">Mindmake direction lock</p>
    <h1>A clean brief to build from.</h1>
    <p class="meta">${data.export.status === 'complete' ? 'Complete' : 'Partial recovery copy'} · ${data.export.confirmed_count} of ${data.export.question_count} choices confirmed · ${escapeHTML(new Date(data.export.created_at).toLocaleString('en-GB'))}</p>
    <section><h2>Already locked</h2><ol class="locked">${lockedDecisions.map(decision => `<li>${escapeHTML(decision)}</li>`).join('')}</ol></section>
    <section><h2>Confirmed choices</h2><div class="decisions">${responseRows || '<p>No choices confirmed yet.</p>'}</div></section>
    ${unanswered}
  </main>
  <script type="application/json" id="mindmake-decision-export">${safeJSON}<\/script>
  <!-- MINDMAKE DECISION BRIEF END -->
</body>
</html>`;
      }

      async function copyExport(partial) {
        const html = buildExportHTML(partial);
        try {
          await navigator.clipboard.writeText(html);
          showToast('HTML result copied. Paste it back into the conversation.');
          return;
        } catch (error) {
          const textarea = document.createElement('textarea');
          textarea.value = html;
          textarea.setAttribute('readonly', '');
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          try {
            const copied = document.execCommand('copy');
            if (!copied) throw new Error('copy failed');
            showToast('HTML result copied. Paste it back into the conversation.');
          } catch (fallbackError) {
            textarea.style.position = 'fixed';
            textarea.style.inset = '16px';
            textarea.style.width = 'calc(100% - 32px)';
            textarea.style.height = 'calc(100% - 32px)';
            textarea.style.opacity = '1';
            textarea.removeAttribute('readonly');
            textarea.focus();
            textarea.select();
            showToast('Copy was blocked. The HTML is selected. Press Ctrl+C.');
            return;
          }
          textarea.remove();
        }
      }

      function downloadExport(partial) {
        const html = buildExportHTML(partial);
        try {
          const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = `mindmake-direction-brief-${new Date().toISOString().slice(0, 10)}${partial ? '-progress' : ''}.html`;
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          showToast(partial ? 'Progress copy downloaded.' : 'HTML brief downloaded.');
        } catch (error) {
          copyExport(partial);
        }
      }

      function focusSurfaceHeading() {
        requestAnimationFrame(() => {
          const heading = document.querySelector('.surface h1[tabindex], .surface h2[tabindex]');
          heading?.focus({ preventScroll: true });
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }

      function escapeHTML(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function escapeAttr(value) { return escapeHTML(value); }

      downloadProgress.addEventListener('click', () => downloadExport(true));
      render();
    })();
  </script>
</body>
</html>
