<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Mindmake / shell alignment lock</title>
    <link rel="stylesheet" href="./alignment-lock.css" />
  </head>
  <body>
    <main>
      <header class="proof-head">
        <p>Shell alignment lock</p>
        <h1>One edge. Every device.</h1>
      </header>

      <section class="proofs" aria-label="Locked desktop and mobile shell alignment">
        <article class="proof proof-desktop">
          <h2>Desktop</h2>
          <div class="viewport">
            <header class="masthead">
              <a class="brand" href="#" aria-label="Mindmake home" tabindex="-1">
                <img class="mark" src="../../../../src/assets/mindmake-mark.svg" alt="" />
                <img class="wordmark" src="../../../../src/assets/mindmake-wordmark.svg" alt="Mindmake" />
              </a>
              <span class="route">New-age leadership</span>
              <span class="menu">Menu <i aria-hidden="true"></i></span>
            </header>
            <div class="hero-copy">
              <strong>Build one useful AI system on real work.</strong>
            </div>
          </div>
        </article>

        <article class="proof proof-mobile">
          <h2>Mobile</h2>
          <div class="viewport">
            <header class="masthead">
              <a class="brand" href="#" aria-label="Mindmake home" tabindex="-1">
                <img class="mark" src="../../../../src/assets/mindmake-mark.svg" alt="" />
                <img class="wordmark" src="../../../../src/assets/mindmake-wordmark.svg" alt="Mindmake" />
              </a>
              <span class="menu">Menu <i aria-hidden="true"></i></span>
            </header>
            <div class="hero-copy">
              <strong>Build one useful AI system on real work.</strong>
            </div>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
