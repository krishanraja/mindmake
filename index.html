    <meta charset="UTF-8" />

    <!-- The first screen, inlined, so it does not wait for the stylesheet.

         The 126KB bundle is render-blocking, and on a 4Mbps connection that put
         first paint at 415ms with the browser's own white page filling every
         millisecond before it. What the prerendered shell needs is about forty
         lines, so it goes here and paints as soon as the HTML lands.

         Kept deliberately small: tokens, the ground, the shell's layout and its
         one moving thing. Everything else still comes from the bundle.
         src/test/first-screen.test.ts holds these values identical to
         src/styles/mindmake.css, because two copies of a colour is exactly how
         a ground drifts. -->
    <style>
      :root{--mm-ink:#0a100d;--mm-tx:#e6ede8;--mm-tx2:#b0c0b7;--mm-mint:#7fe3b4;
        --mm-grotesque:"Archivo Variable","Helvetica Neue",Arial,sans-serif;
        --mm-serif:"Newsreader Variable",Georgia,serif;--mm-body:"Source Serif 4 Variable",Georgia,serif}
      html,body{margin:0;overflow-x:clip;max-width:100vw;background:#0a100d}
      #root{max-width:100vw}
      #prerendered-content{position:relative;height:100dvh;display:grid;align-content:start;gap:10px;
        overflow:hidden;padding:clamp(96px,17vh,150px) clamp(20px,4vw,64px) 0;
        background:var(--mm-ink);color:var(--mm-tx);font-family:var(--mm-body);text-align:center}
      #prerendered-content::before{content:"";position:absolute;inset:-20% -60%;z-index:0;
        background:radial-gradient(60% 45% at 50% 40%,rgba(127,227,180,.16),rgba(127,227,180,0) 70%);
        animation:mm-first-light 9s ease-in-out infinite alternate}
      @keyframes mm-first-light{from{transform:translate3d(-6%,-3%,0) scale(1);opacity:.75}
        to{transform:translate3d(6%,3%,0) scale(1.12);opacity:1}}
      #prerendered-brand{position:absolute;top:0;left:0;right:0;z-index:2;
        padding:22px clamp(20px,4vw,64px);text-align:left;font-family:var(--mm-grotesque);font-weight:700;
        font-size:19px;letter-spacing:-.02em;color:#f5faf8}
      #prerendered-brand span{color:var(--mm-mint)}
      #prerendered-content>*:not(#prerendered-brand,#prerendered-plate){position:relative;z-index:1}
      #prerendered-content h1{max-width:18ch;margin:0 auto;font-family:var(--mm-grotesque);font-weight:700;
        font-size:clamp(26px,4.6vw,54px);letter-spacing:-.035em;line-height:1.03;color:#f5faf8;text-wrap:balance;margin-bottom:100dvh}
      #prerendered-content h2{max-width:30ch;margin:34px auto 0;font-family:var(--mm-grotesque);font-weight:700;
        font-size:clamp(19px,2.4vw,26px);letter-spacing:-.03em;line-height:1.12;color:var(--mm-tx)}
      #prerendered-content p:not(#prerendered-brand){max-width:58ch;margin:12px auto 0;color:var(--mm-tx2);font-size:15.5px;line-height:1.55}
      #prerendered-content a{color:var(--mm-mint);text-decoration:none}
      #prerendered-content ul{max-width:58ch;margin:12px auto 0;padding-left:18px;color:var(--mm-tx2);text-align:left}
      @media (min-width:880px){#prerendered-content[data-hero="split"]{text-align:left;padding-top:clamp(120px,34vh,320px);
        padding-left:max(clamp(20px,4vw,64px),calc((100vw - 1240px)/2))}
      #prerendered-content[data-hero="split"] h1{margin-left:0;max-width:min(626px,52vw);font-size:clamp(26px,4vw,46px);margin-bottom:18px}
      #prerendered-content[data-hero="split"]>p:not(#prerendered-brand){max-width:56ch;margin-inline:0}
      #prerendered-content[data-hero="split"] h2:first-of-type{margin-top:100dvh}}
      #prerendered-content nav{display:none}
      .prerendered-claim{display:block;font-family:var(--mm-serif);font-weight:400;letter-spacing:-.02em;
        line-height:1.06;color:var(--mm-mint)}
      #prerendered-plate{position:absolute;z-index:0;display:block;overflow:hidden;background:#070b09}
      #prerendered-plate img{width:100%;height:100%;object-fit:cover;display:block}
      #prerendered-content[data-hero="centred"] #prerendered-plate{left:50%;top:calc(clamp(96px,17vh,150px) - 46px);
        width:min(1240px,calc(100% - 2*clamp(20px,4vw,64px)));height:clamp(360px,52vh,460px);transform:translateX(-50%);border-radius:3px}
      #prerendered-content[data-hero="centred"] #prerendered-plate::after{content:"";position:absolute;inset:0;
        background:linear-gradient(180deg,rgba(7,11,9,.35),rgba(7,11,9,.72))}
      #prerendered-content[data-hero="split"] #prerendered-plate{display:none}
      @media (min-width:880px){#prerendered-content[data-hero="centred"] #prerendered-plate{height:clamp(420px,62vh,600px)}
      #prerendered-content[data-hero="split"] #prerendered-plate{display:block;
        right:max(clamp(20px,4vw,64px),calc((100vw - 1240px)/2));top:50%;width:min(46%,570px);
        aspect-ratio:1/1;height:auto;transform:translateY(-50%);border-radius:3px}}
      @media (prefers-reduced-motion:reduce){#prerendered-content::before{animation:none}}
    </style>
