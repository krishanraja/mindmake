<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Start here S2 · corrected review S3</title>
  <style>
    :root{--paper:#eee3cf;--mint:#83e4bd;--line:rgba(238,227,207,.22)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030b08;color:var(--paper);font-family:Arial,sans-serif}
    body{padding:32px}.review-head{max-width:1500px;margin:0 auto 20px}.review-head p{margin:0;color:var(--mint);font:11px monospace;letter-spacing:.14em;text-transform:uppercase}.review-head h1{margin:8px 0 0;font:400 32px Georgia,serif}
    .pair{max-width:1500px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:20px;align-items:start}.frame{min-width:0;border:1px solid var(--line);background:#0a1712;box-shadow:0 18px 70px rgba(0,0,0,.45)}.label{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;border-bottom:1px solid var(--line);font:10px monospace;letter-spacing:.1em;text-transform:uppercase;color:rgba(238,227,207,.62)}.label b{color:var(--mint);font-weight:400}.window{position:relative;overflow:hidden}.desktop-window{height:675px}.desktop-window iframe{width:1440px;height:900px;border:0;display:block;transform:scale(.75);transform-origin:0 0}.mobile-window{width:390px;height:844px;max-width:100%}.mobile-window iframe{width:390px;height:844px;border:0;display:block;transform-origin:0 0}
    @media(max-width:1562px){.pair{grid-template-columns:1fr}.mobile-window{margin:auto}}
    @media(max-width:1000px){body{padding:16px}}
  </style>
</head>
<body>
  <header class="review-head"><p>START HERE / S2 · REVIEW S3</p><h1>Desktop and mobile.</h1></header>
  <main class="pair">
    <section class="frame"><div class="label"><b>Desktop</b><span>1440 × 900</span></div><div class="window desktop-window"><iframe src="./index-s2.html" title="Desktop Start here S2"></iframe></div></section>
    <section class="frame"><div class="label"><b>Mobile</b><span>390 × 844</span></div><div class="window mobile-window"><iframe src="./index-s2.html" title="Mobile Start here S2"></iframe></div></section>
  </main>
  <script>
    (() => {
      const desktopWindow = document.querySelector('.desktop-window');
      const desktopFrame = desktopWindow.querySelector('iframe');
      const mobileWindow = document.querySelector('.mobile-window');
      const mobileFrame = mobileWindow.querySelector('iframe');
      const fit = () => {
        const desktopScale = innerWidth >= 1563 ? 0.75 : Math.min(1, desktopWindow.clientWidth / 1440);
        const mobileScale = Math.min(1, mobileWindow.clientWidth / 390);
        desktopFrame.style.transform = `scale(${desktopScale})`;
        desktopWindow.style.height = `${900 * desktopScale}px`;
        mobileFrame.style.transform = `scale(${mobileScale})`;
        mobileWindow.style.height = `${844 * mobileScale}px`;
      };
      new ResizeObserver(fit).observe(document.querySelector('.pair'));
      addEventListener('resize', fit, { passive: true });
      fit();
    })();
  </script>
</body>
</html>
