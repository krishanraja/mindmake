name: Approved route lock

# Two tiers, because one of them is a promotion gate and the other is a save
# button. The source gates below run on everything and take a few minutes. The
# browser matrix is 208 real route cases on two platforms and is what stands
# between a commit and mindmake.co, so it runs when something is actually on its
# way to main: a pull request targeting it, or main itself. Nothing that runs
# before a merge to main changed when this was split; commits that are not being
# released stopped paying for the release gate.
on:
  pull_request:
  push:
    # `pull_request` already covers every branch through its own PR. Without this
    # filter each push to a PR branch ran the whole thing a second time, which
    # cost nothing in wall clock and a second macOS runner, the scarcest thing in
    # the account, so the duplicate was usually what the first one queued behind.
    branches: [main]

# A superseded run is not evidence of anything. Pushing four commits over ten
# minutes used to run the matrix four times and wait for all four; now only the
# newest survives. Keyed per ref, so one branch cancelling never touches another.
#
# Never on main. Vercel promotes a merge to main as it lands, so main's run is
# verifying a commit that is already public: cancelling it because the next
# merge arrived would leave a live deployment with no verification at all.
concurrency:
  # Branch runs share a group and supersede each other. Main runs do not: the
  # group carries the commit, so every push to main gets its own group and there
  # is never an in-progress run for it to cancel.
  #
  # cancel-in-progress alone did not hold. Twice on 2026-09-24/25 a run on main
  # was cancelled one second after the next merge created its run, with the
  # expression evaluating on a push whose ref was refs/heads/main: run
  # 36073810620 on 8b62c3b, and run 36076822553 on 9a22323, which was a commit
  # Vercel had already promoted. Keying the group instead of trusting the
  # expression cannot be silently wrong.
  #
  # This matters more now the browser matrix runs only after the merge: a
  # cancelled run on main is a released commit with no browser verification at
  # all, which is the one thing the post-merge design must not do.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  approved-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify approved production hashes and contracts
        run: node scripts/qa/approved-route-lock-check.mjs
      - name: Prove the lock fails closed
        run: node scripts/qa/approved-route-lock-self-test.mjs
      - name: Prove material review fails closed
        run: npm run qa:material-review:self-test
      - name: Verify language contract
        run: npm run qa:plain-language
      - name: Verify lint contract
        run: npm run lint
      - name: Verify full regression suite
        run: npm test -- --maxWorkers=2
      - name: Build the approved routes
        run: npm run build
      - name: Verify the feedback ledger is well formed
        # A record of Krish's feedback, not a merge gate (Krish, 2026-09-25).
        # This fails on a malformed entry; an open item never blocks a branch.
        run: npm run qa:website-feedback
      - name: Freeze the single built candidate for both platforms
        uses: actions/upload-artifact@v4
        with:
          name: approved-built-candidate
          path: dist/
          if-no-files-found: error
          compression-level: 0
  browser-verification:
    needs: approved-routes
    # main only, after the merge, against the commit Vercel promotes.
    #
    # Ruling (Krish, 2026-09-25): merging does not wait on the browser matrix.
    # It used to also run on every pull request into main, which cost a second
    # macOS runner and several minutes per push while changing no decision,
    # because the merge did not wait for its result. Browsers verify what was
    # released rather than what might be; a failure here is a signal to fix
    # forward or roll back, both of which this repository can do in minutes.
    #
    # The source gates above still run on every commit and every pull request,
    # so lint, typecheck, the unit suite, the lock and its self-test, the
    # language contract and the full build all still gate a branch before it
    # lands. Nothing about what the matrix checks changed: the same 208 route
    # cases and the same three engines run on the same frozen artifact.
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        # One engine per leg, because `engines` was a space-separated list that
        # the release-route step below walked in a bash loop. Chromium and
        # Firefox therefore queued behind each other on a single Linux runner:
        # measured on run 36067326051, that one step took 6m25s while the whole
        # macOS leg finished in 5m14s, so the Linux leg, not WebKit, was the
        # critical path and the run took 9m10s. Split, the two Linux engines run
        # at the same time and the critical path becomes macOS WebKit.
        #
        # Nothing is narrowed. The same 208 route cases run on the same frozen
        # artifact, and qa:homepage-release still launches all three engines on
        # both platforms, which is why the install step below is never filtered
        # to `engine`.
        include:
          - os: ubuntu-latest
            engine: chromium
          - os: ubuntu-latest
            engine: firefox
          - os: macos-latest
            engine: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: approved-built-candidate
          path: dist/
      - name: Resolve the pinned browser build
        id: playwright
        shell: bash
        # The cache key has to name the exact Playwright version, or a version
        # bump silently restores the previous browser build and the matrix runs
        # against something other than what the lockfile pins.
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore the browser payload
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install release verification browsers
        # All three on both platforms. `matrix.engine` governs the release-route
        # step alone, which sets QA_ENGINE per engine; qa:homepage-release below
        # launches chromium, firefox and webkit whatever this leg is, which is
        # the contract its own comment says is never narrowed to fit an engine
        # filter. Narrowing this install to the leg's own engine on 24 September made
        # the macOS leg fail on a missing chromium in under two minutes.
        #
        # Split in two because only half of it is cacheable: the Linux system
        # dependencies are an apt install that a cache cannot restore, while the
        # browser payload is exactly what the step above brought back.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx playwright install-deps chromium firefox webkit
          fi
          npx playwright install chromium firefox webkit
      - name: Verify actual homepage scroll builds and lead entry
        # All twelve ordered-state cases run on BOTH platforms. The contract is
        # never narrowed to fit an engine filter or a missing observation.
        run: npm run qa:homepage-release
      - name: Verify served and hydrated search metadata and share assets
        # Once per run, not once per Linux engine: it reads served metadata,
        # which no engine filter changes.
        if: matrix.engine == 'chromium'
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4346 --strictPort &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4346/ > /dev/null; then break; fi
            sleep 1
          done
          QA_REVISION="$GITHUB_SHA" npm run qa:discoverability -- --base=http://127.0.0.1:4346 --directory-index
      - name: Verify one left edge per page
        # Serves dist/ itself in Vercel's resolution order, so it reads the same
        # prerendered files the matrix below does. One platform is enough: this
        # measures layout the three engines resolve identically, and the widths
        # it walks are the same on each.
        if: runner.os == 'Linux'
        run: npm run qa:logo-alignment
      - name: Verify built public routes and navigation
        # Same 208 route cases and 9 navigation/redirect supplements. WebKit's
        # media gate runs on its Safari-like native platform; Linux WPE failures
        # and no-app reproduction remain in the dated release evidence.
        shell: bash
        env:
          QA_ENGINE: ${{ matrix.engine }}
        run: npm run qa:release-routes
      - name: Verify the leadership story builds by scroll
        # The fault this catches shipped and then survived the gate meant to
        # catch it: the old one clicked every control on the page and passed a
        # route where none of the three pinned sequences pinned at all. This one
        # never clicks. It scrolls, forwards and in reverse, and fails if
        # scrolling alone does not reach every state or if it finds a run of
        # empty viewport. Its own negative control removes the pins and must
        # fail, so a green result cannot mean it measured nothing.
        #
        # Linux only, deliberately. The matrix split above makes macOS WebKit
        # the critical path for the whole run, and this would add to it. The
        # engine still gets covered: the gate runs on WebKit locally, where the
        # route's own sequences pass, because what it measures is scroll state
        # in the DOM rather than the media playback that fails on Linux.
        if: runner.os == 'Linux'
        shell: bash
        env:
          QA_ENGINE: ${{ matrix.engine }}
        run: npm run qa:new-age-r5-production
      - name: Retain release verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-release-evidence-${{ matrix.os }}-${{ matrix.engine }}
          path: |
            artifacts/homepage-release/
            artifacts/new-age-leadership/
          if-no-files-found: error
