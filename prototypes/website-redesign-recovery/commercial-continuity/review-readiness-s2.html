<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Commercial readiness · paired review</title>
    <style>
      *{box-sizing:border-box}html{background:#06110d;color:#e8dcc4;font-family:Arial,sans-serif}body{margin:0;padding:22px}.head{display:flex;align-items:end;justify-content:space-between;gap:20px;max-width:1600px;margin:0 auto 18px}.head h1{margin:0;font-size:21px}.head p{margin:6px 0 0;color:#91a197;font-size:12px}.head a{display:inline-flex;align-items:center;min-height:44px;color:#a8f0ca}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.29fr);gap:16px;max-width:1600px;margin:auto}.frame{min-width:0}.label{display:flex;justify-content:space-between;gap:12px;margin:0 0 8px;color:#a8f0ca;font:10px/1.2 monospace;letter-spacing:.08em;text-transform:uppercase}.window{position:relative;width:100%;overflow:hidden;border:1px solid #2c4438;background:#0b1713}.canvas{position:absolute;top:0;left:0;transform-origin:top left}.canvas iframe{display:block;border:0;background:#06110d}@media(max-width:980px){body{padding:12px}.grid{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}}
    </style>
  </head>
  <body>
    <header class="head"><div><h1>Commercial readiness synthesis</h1><p>Desktop and mobile · live responsive surfaces</p></div><a href="./index-readiness-s2.html">Open responsive synthesis</a></header>
    <main class="grid">
      <section class="frame"><div class="label"><span>Desktop · 1440 × 900</span><a href="./index-readiness-s2.html">Open</a></div><div class="window" data-w="1440" data-h="900"><div class="canvas"><iframe title="Desktop commercial-readiness synthesis" src="./index-readiness-s2.html" width="1440" height="900"></iframe></div></div></section>
      <section class="frame"><div class="label"><span>Mobile · 390 × 844</span><a href="./index-readiness-s2.html">Open</a></div><div class="window" data-w="390" data-h="844"><div class="canvas"><iframe title="Mobile commercial-readiness synthesis" src="./index-readiness-s2.html" width="390" height="844"></iframe></div></div></section>
    </main>
    <script>
      const resize=()=>document.querySelectorAll('.window').forEach(win=>{const w=Number(win.dataset.w),h=Number(win.dataset.h),scale=Math.min(1,win.clientWidth/w);win.style.height=`${Math.ceil(h*scale)}px`;win.querySelector('.canvas').style.transform=`scale(${scale})`;});
      new ResizeObserver(resize).observe(document.body);resize();
    </script>
  </body>
</html>
